name: Verify iteration 0.12 branch state

on:
  push:
    branches: ["agent/iteration-12-practitioner-intake"]
    paths:
      - ".github/workflows/verify-iteration-12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/iteration-12-practitioner-intake
      - name: Verify committed release
        run: |
          test ! -d .iteration12-bundle
          test ! -f .github/workflows/apply-iteration-12.yml
          test ! -f .github/workflows/apply-iteration-12-v2.yml
          test ! -f .github/workflows/apply-iteration-12-v3.yml
          test -f scripts/apply_iteration_12.py
          test -f scripts/validate_iteration_12.py
          make validate
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/public-data.json').read_text())
          labels={n.get('label') for n in d.get('nodes',[])}
          assert d['meta']['release'].startswith('0.12-')
          assert {'Ivo Velitchkov','Patrick Hoverstadt'} <= labels
          print(json.dumps(d['meta'], indent=2, sort_keys=True))
          PY
