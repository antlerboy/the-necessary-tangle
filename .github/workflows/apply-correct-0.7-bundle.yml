name: Diagnose corrected 0.7 constellation bundle

on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths:
      - ".github/workflows/apply-correct-0.7-bundle.yml"
      - ".correct-0.7-bundle/**"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final
          fetch-depth: 0
      - name: Compare corrected graph clues with main and rejected branch
        shell: bash
        run: |
          set -u
          cat .correct-0.7-bundle/part-* | base64 --decode > /tmp/correct.tar.gz
          set +e
          gzip -dc /tmp/correct.tar.gz > /tmp/correct.tar
          set -e
          mkdir -p /tmp/correct
          set +e
          tar -xf /tmp/correct.tar -C /tmp/correct
          set -e

          python3 - <<'PY'
          import json, subprocess, tempfile, pathlib
          refs=['origin/main','origin/release-0.7-constellation-alpha']
          for ref in refs:
              print('\n===', ref, 'data/public-data.json ===')
              raw=subprocess.check_output(['git','show',f'{ref}:data/public-data.json'])
              d=json.loads(raw)
              print('top keys:', list(d.keys()) if isinstance(d,dict) else type(d).__name__)
              if isinstance(d,dict):
                  for k,v in d.items():
                      if isinstance(v,(list,dict)):
                          print(k, len(v))
                      elif isinstance(v,(str,int,float,bool)) or v is None:
                          print(k, v)
                  entries=d.get('entries') or d.get('nodes') or d.get('items') or []
                  rels=d.get('relationships') or d.get('relations') or d.get('edges') or d.get('connections') or []
                  print('inferred entries:', len(entries))
                  print('inferred relations:', len(rels))
                  if rels:
                      print('relation sample keys:', sorted(rels[0].keys()))
          print('\n=== corrected emergent analysis counts ===')
          p=pathlib.Path('/tmp/correct/documentation/emergent-categories-analysis.json')
          if p.exists():
              d=json.loads(p.read_text())
              print(json.dumps(d.get('counts',{}), indent=2, sort_keys=True))
              print('snapshot consistency:', json.dumps(d.get('snapshot_consistency',{}), indent=2, sort_keys=True))
          PY

          echo "--- analyser help/source clues ---"
          python3 /tmp/correct/scripts/analyse_emergent_categories.py --help || true
          sed -n '1,240p' /tmp/correct/scripts/analyse_emergent_categories.py

          echo "--- main validation/build script inventory ---"
          git ls-tree -r --name-only origin/main scripts data docs .github | sort

          echo "--- rejected validation/build script inventory ---"
          git ls-tree -r --name-only origin/release-0.7-constellation-alpha scripts data docs .github | sort
