name: Inspect corrected 0.7 relation vocabulary
on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths: [".github/workflows/apply-correct-0.7-bundle.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final
      - run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/public-data.json'))
          for r in sorted(d['relation_types'], key=lambda x:x['relation_type']):
              print(f"{r['relation_type']} | {r['relation_family']} | {r.get('plain_phrase','')} | directed={r.get('directed')}")
          PY
