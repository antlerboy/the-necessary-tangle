name: Diagnose corrected 0.7 constellation bundle
on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths: [".github/workflows/apply-correct-0.7-bundle.yml", ".correct-0.7-bundle/**"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final
          fetch-depth: 0
      - name: Inspect current graph neighbourhood and relation vocabulary
        run: |
          git show origin/main:data/public-data.json > /tmp/main.json
          python3 - <<'PY'
          import json
          from collections import defaultdict
          d=json.load(open('/tmp/main.json'))
          redirects=d.get('canonical_redirects',{})
          canon=lambda x: redirects.get(x,x)
          nodes={n['id']:n for n in d['nodes'] if n.get('public_visibility')=='public' and canon(n['id'])==n['id']}
          excluded={'classification','evidence','documentary','legacy'}
          adj=defaultdict(list)
          for e in d['edges']:
              s,t=canon(e.get('source')),canon(e.get('target'))
              substantive=(e.get('relation_family') not in excluded and e.get('relation_type')!='legacy_association_unspecified' and e.get('claim_status')!='legacy_unresolved')
              if s not in nodes or t not in nodes or s==t or not substantive: continue
              adj[s].append((t,e)); adj[t].append((s,e))
          focus=['concept_emergence','concept_observer','concept_self_organisation','person_heinz_von_foerster','tradition_cybernetics','concept_feedback']
          for nid in focus:
              print('\n###',nid, nodes.get(nid,{}).get('label'), 'degree',len({x[0] for x in adj[nid]}),'edge_records',len(adj[nid]))
              for other,e in sorted(adj[nid], key=lambda z:(nodes.get(z[0],{}).get('label',''),z[1].get('id',''))):
                  print(' ',e.get('id'), '::',nid,'--',other,'::',nodes.get(other,{}).get('label'), '::',e.get('relation_family'),e.get('relation_type'),e.get('plain_phrase'),'::',e.get('claim_status'))
          print('\n===== ALL RELATION TYPES =====')
          for r in sorted(d.get('relation_types',[]), key=lambda r:r.get('relation_type','')):
              print(json.dumps(r,ensure_ascii=False,sort_keys=True))
          PY
