name: Diagnose corrected 0.7 constellation bundle
on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths: [".github/workflows/apply-correct-0.7-bundle.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final
          fetch-depth: 0
      - name: Print canonical data shapes needed for 0.7 overlay
        run: |
          git show origin/main:data/public-data.json > /tmp/main.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/main.json'))
          for typ in ['Person','Concept','Organisation','Publication','Tradition']:
              n=next((x for x in d['nodes'] if x.get('entity_type')==typ and x.get('public_visibility')=='public'),None)
              print('\nNODE',typ); print(json.dumps(n,ensure_ascii=False,indent=2))
          print('\nSOURCE'); print(json.dumps(next(x for x in d['sources'] if x.get('url')),ensure_ascii=False,indent=2))
          wanted=['developed_or_extended','formulated_by','instantiates','self_identifies_with','collaborated_with','member_of','specialises','uses','historical_precursor']
          by={x.get('relation_type'):x for x in d.get('relation_types',[])}
          print('\nRELATION TYPES')
          for k in wanted:
              print(json.dumps(by.get(k),ensure_ascii=False,indent=2))
          print('\nEDGE EXAMPLES')
          for typ in wanted:
              e=next((x for x in d['edges'] if x.get('relation_type')==typ),None)
              print(typ, json.dumps(e,ensure_ascii=False,indent=2))
          print('\nTOP LEVEL KEYS',sorted(d.keys()))
          print('\nMETA'); print(json.dumps(d['meta'],ensure_ascii=False,indent=2))
          PY
