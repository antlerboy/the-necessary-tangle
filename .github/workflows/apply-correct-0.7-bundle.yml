name: Diagnose corrected 0.7 constellation bundle
on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths: [".github/workflows/apply-correct-0.7-bundle.yml", ".correct-0.7-bundle/**"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final
          fetch-depth: 0
      - name: Extract exact corrected 0.7 connection clues
        run: |
          cat .correct-0.7-bundle/part-* | base64 --decode > /tmp/correct.tar.gz
          set +e
          gzip -dc /tmp/correct.tar.gz > /tmp/correct.tar
          mkdir -p /tmp/correct
          tar -xf /tmp/correct.tar -C /tmp/correct
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/correct/documentation/public-knowledge-for-chatgpt.md')
          lines=p.read_text().splitlines()
          names=['Cliff Joslyn','Evolutionary cybernetics','Francis Heylighen','Global brain','Metasystem transition','Principia Cybernetica Project','Principia Cybernetica Web','Semantic network','Valentin Turchin']
          print('===== HEADINGS =====')
          for i,line in enumerate(lines,1):
              if line.startswith('#'):
                  print(f'{i}: {line}')
          print('===== OCCURRENCES OUTSIDE ENTRY DESCRIPTIONS =====')
          for name in names:
              print('\n###',name)
              hits=[i for i,line in enumerate(lines) if name.casefold() in line.casefold()]
              for i in hits:
                  lo=max(0,i-3); hi=min(len(lines),i+4)
                  print(f'-- lines {lo+1}-{hi} --')
                  for j in range(lo,hi): print(f'{j+1}: {lines[j]}')
          print('\n===== EMERGENT CATEGORY JSON =====')
          print(Path('/tmp/correct/documentation/emergent-categories-analysis.json').read_text())
          PY
          echo "===== MAIN RELATION TYPES LIKELY RELEVANT ====="
          git show origin/main:data/public-data.json > /tmp/main.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/main.json'))
          terms=('member','collab','develop','formulat','semantic','emerg','self-organ','associated','contribut','influenc','created','authored','part_of','instantiate','special')
          for r in d.get('relation_types',[]):
              text=' '.join(str(v) for v in r.values()).lower()
              if any(t in text for t in terms):
                  print(json.dumps(r,ensure_ascii=False,sort_keys=True))
          print('===== RELEVANT EXISTING EDGE EXAMPLES =====')
          for e in d.get('edges',[]):
              text=' '.join(str(v) for v in e.values()).lower()
              if any(t in text for t in ('collaborat','developed','formulated','member','semantic network','self-organisation','emergence')):
                  print(json.dumps(e,ensure_ascii=False,sort_keys=True))
          PY
