name: Diagnose corrected 0.7 constellation bundle
on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths: [".github/workflows/apply-correct-0.7-bundle.yml", ".correct-0.7-bundle/**"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final
          fetch-depth: 0
      - name: Extract recoverable corrected release specification
        run: |
          cat .correct-0.7-bundle/part-* | base64 --decode > /tmp/correct.tar.gz
          set +e
          gzip -dc /tmp/correct.tar.gz > /tmp/correct.tar
          mkdir -p /tmp/correct
          tar -xf /tmp/correct.tar -C /tmp/correct
          set -e
          git show origin/main:documentation/public-knowledge-for-chatgpt.md > /tmp/main-public.md
          python3 - <<'PY'
          from pathlib import Path
          def sections(path):
              lines=Path(path).read_text().splitlines()
              try: start=lines.index('# Public entries')+1
              except ValueError: start=0
              out={}; cur=None; buf=[]
              for line in lines[start:]:
                  if line.startswith('## '):
                      if cur is not None: out[cur]='\n'.join(buf).rstrip()+'\n'
                      cur=line[3:]; buf=[line]
                  elif cur is not None: buf.append(line)
              if cur is not None: out[cur]='\n'.join(buf).rstrip()+'\n'
              return out
          main=sections('/tmp/main-public.md')
          corrected=sections('/tmp/correct/documentation/public-knowledge-for-chatgpt.md')
          added=sorted(set(corrected)-set(main), key=str.casefold)
          removed=sorted(set(main)-set(corrected), key=str.casefold)
          changed=sorted(k for k in set(main)&set(corrected) if main[k]!=corrected[k], key=str.casefold)
          print('ADDED PUBLIC ENTRY HEADINGS:', len(added))
          for k in added: print('-',k)
          print('REMOVED PUBLIC ENTRY HEADINGS:', len(removed), removed)
          print('CHANGED EXISTING PUBLIC ENTRY SECTIONS:', len(changed))
          for k in changed: print('-',k)
          print('\n===== FULL ADDED ENTRY SECTIONS =====')
          for k in added:
              print(corrected[k])
          PY
          echo "===== RECOVERED VALIDATOR PREFIX ====="
          cat /tmp/correct/scripts/validate_constellation.py
          echo "===== PRINCIPIA FIRST PASS ====="
          cat /tmp/correct/documentation/principia-cybernetica-first-pass.md
          echo "===== CANONICAL SOURCE REGISTER ====="
          cat /tmp/correct/documentation/canonical-source-register.md
          echo "===== EMERGENT CATEGORIES ====="
          cat /tmp/correct/documentation/emergent-categories.md
