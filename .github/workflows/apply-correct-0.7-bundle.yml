name: Diagnose corrected 0.7 constellation bundle

on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths:
      - ".github/workflows/apply-correct-0.7-bundle.yml"
      - ".correct-0.7-bundle/**"

permissions:
  contents: read

concurrency:
  group: diagnose-correct-0.7-bundle
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged release branch
        uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final

      - name: Inspect incomplete staged payload
        shell: bash
        run: |
          set -u
          cat .correct-0.7-bundle/part-* | base64 --decode > /tmp/tangle-correct-0.7.tar.gz
          echo "compressed bytes: $(wc -c < /tmp/tangle-correct-0.7.tar.gz)"
          sha256sum /tmp/tangle-correct-0.7.tar.gz

          set +e
          gzip -dc /tmp/tangle-correct-0.7.tar.gz > /tmp/tangle-correct-0.7.tar
          gzip_status=$?
          set -e
          echo "gzip status: ${gzip_status}"
          echo "recoverable tar bytes: $(wc -c < /tmp/tangle-correct-0.7.tar)"

          echo "--- recoverable tar members ---"
          set +e
          tar -tvf /tmp/tangle-correct-0.7.tar
          tar_status=$?
          set -e
          echo "tar list status: ${tar_status}"

          mkdir -p /tmp/tangle-partial
          set +e
          tar -xf /tmp/tangle-correct-0.7.tar -C /tmp/tangle-partial
          extract_status=$?
          set -e
          echo "tar extract status: ${extract_status}"

          echo "--- recovered files ---"
          find /tmp/tangle-partial -type f -printf '%P\t%s bytes\n' | sort | head -300

          echo "--- likely release metadata ---"
          for f in README.md CHANGELOG.md CITATION.cff manifest.json release-manifest.json documentation/roadmap.md documentation/coverage-programme.md; do
            if [ -f "/tmp/tangle-partial/$f" ]; then
              echo "===== $f ====="
              sed -n '1,220p' "/tmp/tangle-partial/$f"
            fi
          done

          if [ "$gzip_status" -eq 0 ] && [ "$tar_status" -eq 0 ] && [ "$extract_status" -eq 0 ]; then
            echo "Payload is complete after all."
          else
            echo "Payload is incomplete; diagnostic completed without modifying the branch."
          fi
