name: Inspect corrected 0.7 data model
on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths: [".github/workflows/apply-correct-0.7-bundle.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final
      - name: Print representative records
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/public-data.json'))
          for nid in ['person_heinz_von_foerster','concept_emergence','tradition_cybernetics']:
              n=next(x for x in d['nodes'] if x['id']==nid)
              print('\nNODE',nid, json.dumps(n,ensure_ascii=False,indent=2))
          print('\nNODE KEYS',sorted(d['nodes'][0]))
          print('\nEDGE KEYS',sorted(d['edges'][0]))
          print('\nSOURCE KEYS',sorted(d['sources'][0]))
          PY
