name: Diagnose corrected 0.7 constellation bundle
on:
  push:
    branches: ["release-0.7-constellation-alpha-final"]
    paths: [".github/workflows/apply-correct-0.7-bundle.yml", ".correct-0.7-bundle/**"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha-final
          fetch-depth: 0
      - name: Test main data against corrected 0.7 snapshot
        run: |
          git show origin/main:data/public-data.json > /tmp/main.json
          python3 - <<'PY'
          import json
          from collections import defaultdict, deque
          d=json.load(open('/tmp/main.json'))
          redirects=d.get('canonical_redirects',{})
          canon=lambda x: redirects.get(x,x)
          nodes={n['id']:n for n in d['nodes'] if n.get('public_visibility')=='public' and canon(n['id'])==n['id']}
          excluded={'classification','evidence','documentary','legacy'}
          pairs=set(); edge_records=0; adj=defaultdict(set)
          for e in d['edges']:
              s,t=canon(e.get('source')),canon(e.get('target'))
              substantive=(e.get('relation_family') not in excluded and e.get('relation_type')!='legacy_association_unspecified' and e.get('claim_status')!='legacy_unresolved')
              if s not in nodes or t not in nodes or s==t or not substantive: continue
              edge_records+=1
              pair=tuple(sorted((s,t))); pairs.add(pair)
              adj[s].add(t); adj[t].add(s)
          connected={n for n in nodes if adj[n]}
          seen=set(); comps=[]
          for n in nodes:
              if n in seen: continue
              q=[n]; seen.add(n); c=[]
              while q:
                  x=q.pop(); c.append(x)
                  for y in adj[x]:
                      if y not in seen: seen.add(y); q.append(y)
              comps.append(c)
          actual={
              'public_nodes':len(nodes),'substantive_edge_records':edge_records,'unique_undirected_pairs':len(pairs),
              'connected_nodes':len(connected),'isolated_nodes':len(nodes)-len(connected),'components':len(comps),
              'largest_component_nodes':max(map(len,comps),default=0)}
          expected={'public_nodes':204,'substantive_edge_records':96,'unique_undirected_pairs':94,'connected_nodes':77,'isolated_nodes':127,'components':129,'largest_component_nodes':75}
          print('main meta:', json.dumps(d.get('meta',{}), indent=2, sort_keys=True))
          print('actual:', json.dumps(actual, indent=2, sort_keys=True))
          print('expected corrected 0.7:', json.dumps(expected, indent=2, sort_keys=True))
          print('exact snapshot match:', actual==expected)
          print('main has graph_snapshot:', 'graph_snapshot' in d)
          print('main has emergent_categories:', 'emergent_categories' in d)
          print('main has canonical_source_register:', 'canonical_source_register' in d)
          print('main has principia nodes:', [n['id'] for n in d['nodes'] if 'principia' in n.get('id','').lower() or 'principia' in n.get('label','').lower()][:20])
          PY
