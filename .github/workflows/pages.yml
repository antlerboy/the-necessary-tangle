name: Publish The Necessary Tangle
run-name: Publish The Necessary Tangle @ ${{ github.sha }}
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact_name: ${{ steps.pages-artifact-name.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check out the maintained events interface
        uses: actions/checkout@v7
        with:
          repository: antlerboy/systemsmap
          ref: fb4954c7dcd80d2ddd6d5b8c62c2fee6d7893253
          path: _systemsmap
          persist-credentials: false
      - name: Install pinned media inspection tools
        timeout-minutes: 5
        run: |
          # Static packages retain ffmpeg/ffprobe checks without relying on apt mirrors.
          npm install --prefix "$RUNNER_TEMP/tangle-media" --no-save --package-lock=false ffmpeg-static@5.2.0 ffprobe-static@3.1.0
          mkdir -p "$RUNNER_TEMP/tangle-media/bin"
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'tangle-media');
          const binaries = {
            ffmpeg: require(path.join(root, 'node_modules/ffmpeg-static')),
            ffprobe: require(path.join(root, 'node_modules/ffprobe-static')).path,
          };
          for (const [name, binary] of Object.entries(binaries)) {
            fs.symlinkSync(binary, path.join(root, 'bin', name));
          }
          JS
          echo "$RUNNER_TEMP/tangle-media/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tangle-media/bin/ffmpeg" -version
          "$RUNNER_TEMP/tangle-media/bin/ffprobe" -version
      - name: Build and validate the current release
        run: make validate
      - name: Add visit analytics to every published page
        run: python3 scripts/inject-visit-analytics.py docs
      - name: Install pinned browser test runner
        run: |
          npm install --prefix /tmp/practice-browser --no-save playwright@1.55.0
          # Hosted runners already include Chromium libraries and DejaVu fonts.
          /tmp/practice-browser/node_modules/.bin/playwright install chromium
      - name: Test practice pages before publication
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
        run: node scripts/test_events_browser.js && node scripts/test_practice_browser.js && node scripts/test_practice_presentation.js && node scripts/test_intake_browser.js && node scripts/test_maps_browser.js && node scripts/test_library_browser.js && node scripts/test_submission_review_browser.js && node scripts/test_claim_lab_browser.js && node scripts/test_weaver_browser.js && node scripts/test_update_30_browser.js && node scripts/test_update_31_browser.js && node scripts/test_update_32_browser.js && node scripts/test_update_33_browser.js && node scripts/test_update_34_browser.js && node scripts/test_update_35_browser.js && node scripts/test_saidtosomeone_browser.js && node scripts/test_isss_wiki_browser.js && node scripts/test_readable_atlas_browser.js && node scripts/test_update_36_browser.js && node scripts/test_update_37_browser.js && node scripts/test_update_38_browser.js && node scripts/test_update_39_browser.js && node scripts/test_update_40_browser.js && node scripts/test_update_41_browser.js && node scripts/test_syscoi_intake_browser.js && node scripts/test_sysprac26_browser.js
      - name: Check both guide editions and download names
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
        run: node scripts/test_guide_editions.cjs
      - name: Record the exact deployed release and test summary
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          manifest = {'release': data['meta']['release'], 'commit': os.environ['DEPLOY_COMMIT'], 'workflow_run_id': os.environ['DEPLOY_RUN_ID'], 'deployed_at': datetime.now(timezone.utc).isoformat()}
          manifest['reader_release'] = data['meta']['release']
          Path('docs/deployment.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          tests = {name: json.loads(Path(path).read_text()) for name, path in {'structure': 'validation/practice-structure.json', 'models': 'validation/practice-models.json', 'browser': 'validation/practice-browser/report.json', 'presentation': 'validation/practice-browser/presentation-report.json'}.items()}
          tests['commit'] = os.environ['DEPLOY_COMMIT']
          tests['browser']['base'] = 'Built publication candidate'
          Path('docs/systems-thinking/practice/assets/test-results.json').write_text(json.dumps(tests, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Preserve practice test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systems-practice-test-results
          path: |
            validation/practice-structure.json
            validation/practice-models.json
            validation/practice-browser/*.json
            validation/practice-browser/*.png
            validation/intake-browser/*.json
            validation/intake-browser/*.png
            validation/maps-browser/*.json
            validation/maps-browser/*.png
            validation/library-structure.json
            validation/library-browser/
            validation/claim-lab-browser/
            validation/weaver-browser/
            validation/update-30-browser/
            validation/update-31-browser/
            validation/isss-wiki-browser/
            validation/update-36-browser/
            validation/update-37-browser/
            validation/update-38-browser/
            validation/update-39-browser/
            validation/update-40-browser/
            validation/update-41-browser/
            validation/readable-atlas-browser/
            validation/sysprac26-browser/
            validation/syscoi-intake-browser/
            validation/update-35-browser/
          if-no-files-found: ignore
      - name: Restore narrated Encounters film
        id: encounters-cache
        uses: actions/cache@v4
        with:
          path: docs/encounters-with-the-other
          key: encounters-v1-${{ hashFiles('sources/encounters-with-the-other/**', 'scripts/build_encounters_film.py') }}
      - name: Render narrated Encounters film
        if: steps.encounters-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /tmp/encounters-voice
          /tmp/encounters-voice/bin/pip install piper-tts==1.3.0 Pillow==11.3.0
          mkdir -p voice
          cd voice
          /tmp/encounters-voice/bin/python -m piper.download_voices en_US-ljspeech-high
          cd ..
          /tmp/encounters-voice/bin/python scripts/build_encounters_film.py
      - name: Verify narrated Encounters film
        run: |
          python3 -m pip install --user --break-system-packages Pillow==11.3.0
          python3 scripts/build_encounters_film.py --verify-only
      - name: Preserve Encounters review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encounters-author-review
          path: |
            docs/encounters-with-the-other/
            validation/encounters/contact-sheet.jpg
            validation/encounters/frame-*.jpg
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Name the Pages artifact for this build attempt
        id: pages-artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.pages-artifact-name.outputs.name }}
          path: ./docs
          include-hidden-files: true
  deploy:
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
          timeout: 1200000
  verify-live:
    name: Verify the live practice pages
    runs-on: ubuntu-24.04
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Check out the exact deployed revision
        uses: actions/checkout@v7
      - name: Check live deployment identity and download
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: python3 scripts/prepare_live_practice_check.py
      - name: Install pinned browser test runner
        run: |
          npm install --prefix /tmp/practice-browser --no-save playwright@1.55.0
          # Hosted runners already include Chromium libraries and DejaVu fonts.
          /tmp/practice-browser/node_modules/.bin/playwright install chromium
      - name: Install pinned live media inspection tools
        timeout-minutes: 5
        run: |
          # Static packages retain ffmpeg/ffprobe checks without relying on apt mirrors.
          npm install --prefix "$RUNNER_TEMP/tangle-media" --no-save --package-lock=false ffmpeg-static@5.2.0 ffprobe-static@3.1.0
          mkdir -p "$RUNNER_TEMP/tangle-media/bin"
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'tangle-media');
          const binaries = {
            ffmpeg: require(path.join(root, 'node_modules/ffmpeg-static')),
            ffprobe: require(path.join(root, 'node_modules/ffprobe-static')).path,
          };
          for (const [name, binary] of Object.entries(binaries)) {
            fs.symlinkSync(binary, path.join(root, 'bin', name));
          }
          JS
          echo "$RUNNER_TEMP/tangle-media/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tangle-media/bin/ffmpeg" -version
          "$RUNNER_TEMP/tangle-media/bin/ffprobe" -version
      - name: Verify the live Encounters film and audio
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: python3 scripts/verify_live_encounters.py
      - name: Check both live guide editions and download names
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
          GUIDE_BASE_URL: https://transduction.systems
        run: node scripts/test_guide_editions.cjs
      - name: Exercise the actual public pages
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
          PRACTICE_BASE_URL: https://transduction.systems
          MAPS_BASE_URL: https://transduction.systems
          LIBRARY_BASE_URL: https://transduction.systems
          WEAVER_BASE_URL: https://transduction.systems
          UPDATE_BASE_URL: https://transduction.systems
          SAID_BASE_URL: https://transduction.systems
          EVENTS_BASE_URL: https://transduction.systems
          SYSPRAC_BASE_URL: https://transduction.systems
        run: node scripts/test_events_browser.js && node scripts/test_practice_browser.js && node scripts/test_practice_presentation.js && node scripts/test_maps_browser.js && node scripts/test_library_browser.js && node scripts/test_weaver_browser.js && node scripts/test_update_30_browser.js && node scripts/test_update_31_browser.js && node scripts/test_update_32_browser.js && node scripts/test_update_33_browser.js && node scripts/test_update_34_browser.js && node scripts/test_update_35_browser.js && node scripts/test_saidtosomeone_browser.js && node scripts/test_isss_wiki_browser.js && node scripts/test_readable_atlas_browser.js && node scripts/test_update_36_browser.js && node scripts/test_update_37_browser.js && node scripts/test_update_38_browser.js && node scripts/test_update_39_browser.js && node scripts/test_update_40_browser.js && node scripts/test_update_41_browser.js && node scripts/test_sysprac26_browser.js
      - name: Preserve live verification evidence and downloaded pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systems-practice-live-check
          path: |
            validation/practice-live/
            validation/library-browser/
            validation/encounters-live/
            validation/update-30-browser/
            validation/update-31-browser/
            validation/isss-wiki-browser/
            validation/update-36-browser/
            validation/update-37-browser/
            validation/update-38-browser/
            validation/update-39-browser/
            validation/update-40-browser/
            validation/update-41-browser/
            validation/readable-atlas-browser/
            validation/sysprac26-browser/
            validation/update-35-browser/
            validation/practice-browser/*.json
            validation/practice-browser/*.png
          if-no-files-found: ignore
