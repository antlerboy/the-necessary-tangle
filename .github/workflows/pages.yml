name: Publish The Necessary Tangle
run-name: Publish The Necessary Tangle @ ${{ github.sha }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and validate public release
        run: make validate

      - name: Record the exact deployed release
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          release = data.get('meta', {}).get('release')
          if not release:
              raise SystemExit('No release identifier in data/public-data.json')

          manifest = {
              'release': release,
              'commit': os.environ['DEPLOY_COMMIT'],
              'workflow_run_id': os.environ['DEPLOY_RUN_ID'],
              'deployed_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('docs/deployment.json').write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
