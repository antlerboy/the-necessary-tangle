name: Publish The Necessary Tangle

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build public data and knowledge file
        run: |
          python3 scripts/build_public_data.py
          python3 scripts/apply_release_overrides.py
          python3 scripts/patch_public_site.py
          python3 scripts/build_public_knowledge.py
      - name: Validate public release
        run: |
          python3 scripts/validate_public.py
          ./scripts/check_javascript.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
