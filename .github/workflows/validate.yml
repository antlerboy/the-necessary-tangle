name: Validate public atlas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check out the maintained events interface
        uses: actions/checkout@v7
        with:
          repository: antlerboy/systemsmap
          ref: 22f68feb88286ea9896174ff5ed9a1f8b1533daa
          path: _systemsmap
          persist-credentials: false
      - name: Install media inspection dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build and validate the complete public release
        run: make validate
      - name: Install pinned browser test runner
        run: |
          npm install --prefix /tmp/practice-browser --no-save playwright@1.55.0
          /tmp/practice-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test learner interactions, mobile layout and offline access
        env:
          NODE_PATH: /tmp/practice-browser/node_modules
        run: node scripts/test_practice_browser.js && node scripts/test_practice_presentation.js && node scripts/test_intake_browser.js && node scripts/test_maps_browser.js && node scripts/test_library_browser.js && node scripts/test_submission_review_browser.js && node scripts/test_claim_lab_browser.js && node scripts/test_weaver_browser.js && node scripts/test_update_30_browser.js && node scripts/test_update_31_browser.js
      - name: Preserve practice test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systems-practice-test-results
          path: |
            validation/practice-structure.json
            validation/practice-models.json
            validation/practice-browser/report.json
            validation/practice-browser/*.png
            validation/practice-browser/attempt.md
            validation/claim-lab-browser/
            validation/weaver-browser/
            validation/update-30-browser/
            validation/update-31-browser/
          if-no-files-found: ignore
