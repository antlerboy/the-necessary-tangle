name: Validate public atlas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check out the maintained events interface
        uses: actions/checkout@v7
        with:
          repository: antlerboy/systemsmap
          ref: 27aaa618a1b68a52442e6232b08cd614f733ac73
          path: _systemsmap
          persist-credentials: false

      - name: Install media inspection dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build and validate the complete public release
        run: make validate
