name: Apply release 0.19 living marks

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-release-0-19
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/iteration-0.19-living-marks'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the publication branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-0.19-living-marks
          fetch-depth: 0

      - name: Download and unpack the verified release bundle
        env:
          RELEASE_BUNDLE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b7c4-820a-b8d1-0eabfb2bc14e/raw?se=2026-08-25T08%3A34%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=3ea3bfaf-7110-5fee-a55d-a558783bc0ca&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T08%3A12%3A35Z&ske=2026-08-26T08%3A12%3A35Z&sks=b&skv=2026-02-06&sig=WD3bmZj87k%2BjHVVH0Yh7sZNFwkGjrxMUev98iXfw1xQ%3D"
        run: |
          curl --fail --location --retry 3 --output /tmp/iteration-0.19-release.tar.gz "$RELEASE_BUNDLE_URL"
          echo "46c7f76f93e0ec5f31831345d8175734ce8726e68808aa6ec2c2a6a0a31ee4d8  /tmp/iteration-0.19-release.tar.gz" | sha256sum --check -
          tar -xzf /tmp/iteration-0.19-release.tar.gz

      - name: Make inherited projections and relational documentation reproducible under 0.19
        run: |
          cat > scripts/stamp_current_projections_19.py <<'PY'
          #!/usr/bin/env python3
          """Stamp inherited maintained projections with the current release."""
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          DATA = ROOT / "data" / "public-data.json"
          DOCS_JSON = ROOT / "docs" / "assets" / "public-data.json"
          DOCS_JS = ROOT / "docs" / "assets" / "public-data.js"
          PROJECTIONS = ("reading_list_inventory", "reading_list_coverage", "core_systems_practice")


          def main() -> None:
              data = json.loads(DATA.read_text(encoding="utf-8"))
              release = data.get("meta", {}).get("release")
              generated = data.get("meta", {}).get("generated")
              if not release or not generated:
                  raise SystemExit("Current release metadata is missing")

              for key in PROJECTIONS:
                  projection = data.get(key)
                  if not isinstance(projection, dict):
                      raise SystemExit(f"{key} is missing")
                  projection["release"] = release
                  if "generated" in projection:
                      projection["generated"] = generated

              rendered = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              DATA.write_text(rendered, encoding="utf-8")
              DOCS_JSON.write_text(rendered, encoding="utf-8")
              DOCS_JS.write_text(
                  "window.TANGLE_DATA = " + json.dumps(data, ensure_ascii=False) + ";\n",
                  encoding="utf-8",
              )
              print(f"Stamped inherited projections for {release}.")


          if __name__ == "__main__":
              main()
          PY

          cat > scripts/refresh_relational_document_19.py <<'PY'
          #!/usr/bin/env python3
          """Regenerate the relational-depth document from the current public graph."""
          from __future__ import annotations

          import json
          from pathlib import Path

          from apply_relational_depth_16 import write_relational_document

          ROOT = Path(__file__).resolve().parents[1]
          DATA = ROOT / "data" / "public-data.json"


          def main() -> None:
              data = json.loads(DATA.read_text(encoding="utf-8"))
              if not isinstance(data.get("relational_depth"), dict):
                  raise SystemExit("Current relational-depth measures are missing")
              write_relational_document(data)
              aggregate = data["relational_depth"].get("aggregate", {})
              print(
                  "Refreshed relational-depth document for "
                  f"{aggregate.get('reader_connected_entries')} reader-connected entries."
              )


          if __name__ == "__main__":
              main()
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text(encoding="utf-8")
          marker = "\tpython3 scripts/apply_iteration_19.py\n"
          addition = (
              marker
              + "\tpython3 scripts/stamp_current_projections_19.py\n"
              + "\tpython3 scripts/refresh_relational_document_19.py\n"
          )
          if "scripts/refresh_relational_document_19.py" not in text:
              if marker not in text:
                  raise SystemExit("Could not find the 0.19 build marker in Makefile")
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding="utf-8")
          PY
          chmod +x scripts/stamp_current_projections_19.py scripts/refresh_relational_document_19.py

      - name: Build and validate the complete release
        run: |
          make build
          make validate

      - name: Commit the generated release
        run: |
          rm -f .github/workflows/apply-release-0-19.yml
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Generate release 0.19 public artefact" -m "Build the living-mark interface, register the Complexity Podcast corpus, refresh public data and release documentation, regenerate the full public observation record, and retain the complete historical validation chain."
          git push origin HEAD:agent/iteration-0.19-living-marks

      - name: Record successful generation
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Release 0.19 was built through the complete historical chain, validated, generated and committed to `agent/iteration-0.19-living-marks`.'
            });
