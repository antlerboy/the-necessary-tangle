name: Apply release 0.19 living marks

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-release-0-19
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/iteration-0.19-living-marks'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the publication branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-0.19-living-marks
          fetch-depth: 0

      - name: Download and unpack the verified release bundle
        env:
          RELEASE_BUNDLE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-8424-81f4-95fd-eaad5bc7003b/raw?se=2026-08-25T07%3A02%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=58c2bb72-331e-5b8a-80f0-bad69f45f09a&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T06%3A17%3A45Z&ske=2026-08-26T06%3A17%3A45Z&sks=b&skv=2026-02-06&sig=qr6B2GYmdz8LDcgdg49WOpza7ea%2BK5o2idrC7ooSJv4%3D"
        run: |
          curl --fail --location --retry 3 --output /tmp/iteration-0.19-release.tar.gz "$RELEASE_BUNDLE_URL"
          echo "96d0a009f93bf3ae6978c1ac6f66aa48b4beb94117a80e3d6c9f334978bf6bfe  /tmp/iteration-0.19-release.tar.gz" | sha256sum --check -
          tar -xzf /tmp/iteration-0.19-release.tar.gz

      - name: Build and validate the complete release
        run: |
          make build
          make validate

      - name: Commit the generated release
        run: |
          rm -f .github/workflows/apply-release-0-19.yml
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Generate release 0.19 public artefact" -m "Build the living-mark interface, register the Complexity Podcast corpus, refresh public data and release documentation, regenerate the full public observation record, and retain the complete historical validation chain."
          git push origin HEAD:agent/iteration-0.19-living-marks

      - name: Record successful generation
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Release 0.19 was built through the complete historical chain, validated, generated and committed to `agent/iteration-0.19-living-marks`.'
            });
