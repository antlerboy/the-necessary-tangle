name: Apply release 0.19 living marks

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-release-0-19
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/iteration-0.19-living-marks'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the publication branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-0.19-living-marks
          fetch-depth: 0

      - name: Download and unpack the verified release bundle
        env:
          RELEASE_BUNDLE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-d508-81f4-85a5-cebcc48c8406/raw?se=2026-08-25T06%3A59%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=3882771e-bf6a-5ff0-bddb-4212cf486e6a&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T22%3A48%3A39Z&ske=2026-08-25T22%3A48%3A39Z&sks=b&skv=2026-02-06&sig=CAk3jMpZ%2ByjpCYljv2JCdvOYfdXvtTk8G0W98kqgDAQ%3D"
        run: |
          curl --fail --location --retry 3 --output /tmp/iteration-0.19-release.tar.gz "$RELEASE_BUNDLE_URL"
          echo "029ab691582b1efba958fe5cc25a3af1410e69f53c8c6c10727e0c32f7811122  /tmp/iteration-0.19-release.tar.gz" | sha256sum --check -
          tar -xzf /tmp/iteration-0.19-release.tar.gz

      - name: Build and validate the complete release
        run: |
          make build
          make validate

      - name: Commit the generated release
        run: |
          rm -f .github/workflows/apply-release-0-19.yml
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Generate release 0.19 public artefact" -m "Build the living-mark interface, register the Complexity Podcast corpus, refresh public data and release documentation, regenerate the inherited public measurement panel, and retain the complete historical validation chain."
          git push origin HEAD:agent/iteration-0.19-living-marks

      - name: Record successful generation
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Release 0.19 was built through the complete historical chain, validated, generated and committed to `agent/iteration-0.19-living-marks`.'
            });
