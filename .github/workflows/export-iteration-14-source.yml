name: Export iteration 0.14 source

on:
  push:
    branches: ["agent/iteration-14-snowden-canonical-sources"]
    paths:
      - ".github/workflows/export-iteration-14-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-14-snowden-canonical-sources
          fetch-depth: 0

      - name: Create exact source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github/workflows/export-iteration-14-source.yml -czf /tmp/the-necessary-tangle-main-source.tar.gz .
          sha256sum /tmp/the-necessary-tangle-main-source.tar.gz > /tmp/the-necessary-tangle-main-source.tar.gz.sha256
          git rev-parse HEAD > /tmp/source-commit.txt

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: iteration-14-source
          path: |
            /tmp/the-necessary-tangle-main-source.tar.gz
            /tmp/the-necessary-tangle-main-source.tar.gz.sha256
            /tmp/source-commit.txt
          if-no-files-found: error
          retention-days: 1
