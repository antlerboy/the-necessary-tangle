name: Apply release 0.18 from the verified bundle

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-release-0-18
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/iteration-0.18-usability-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the release branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-0.18-usability-coverage
          fetch-depth: 0

      - name: Detect the source bundle
        id: bundle
        shell: bash
        run: |
          if compgen -G '.iteration18-bundle/part-*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct release scripts
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          cat .iteration18-bundle/part-* | base64 --decode > /tmp/tangle18-scripts.tar.gz
          echo '1bcd75ad9bb038935e29180f3f9dfe9241e03ac55e59658602358d70e4ee42a2  /tmp/tangle18-scripts.tar.gz' | sha256sum --check -
          mkdir -p scripts
          tar -xzf /tmp/tangle18-scripts.tar.gz -C scripts
          chmod +x scripts/apply_iteration_18.py scripts/patch_iteration_18.py scripts/sync_release_docs_18.py scripts/validate_iteration_18.py

      - name: Build and validate the complete release
        run: make validate

      - name: Commit the generated release
        if: steps.bundle.outputs.present == 'true'
        shell: bash
        run: |
          rm -rf .iteration18-bundle .github/workflows/apply-release-0-18.yml
          git config user.name 'Benjamin P Taylor'
          git config user.email 'ben.taylor@redquadrant.com'
          git add -A
          git commit -m 'Publish 0.18 navigable tangle update' -m 'Make entries readable as full pages, repair map panning and link semantics, add a constellation view, incorporate the Linda Booth Sweeney and unFIX source updates, audit requested names and aliases, and refresh observations and release documentation.'
          git push origin HEAD:agent/iteration-0.18-usability-coverage

      - name: Record successful generation
        if: steps.bundle.outputs.present == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Release 0.18 was reconstructed from its checksummed source bundle, built through the complete historical chain, validated, and committed to `agent/iteration-0.18-usability-coverage`.'
            });
