name: Apply the 0.7 iteration bundle

on:
  push:
    branches: ["release-0.7-constellation-alpha"]
    paths:
      - ".github/workflows/apply-iteration-bundle.yml"
      - ".iteration-bundle/**"

permissions:
  contents: write

concurrency:
  group: apply-iteration-bundle-release-0-7
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: release-0.7-constellation-alpha
      - name: Reconstruct iteration bundle
        run: |
          set -euxo pipefail
          cat .iteration-bundle/part-* | base64 --decode > /tmp/tangle-iteration.tar.gz
          tar -tzf /tmp/tangle-iteration.tar.gz >/dev/null
          tar -xzf /tmp/tangle-iteration.tar.gz -C .
      - name: Install analysis dependencies
        run: |
          if [ -f requirements-analysis.txt ]; then
            python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
          fi
      - name: Build and validate iteration
        run: |
          chmod +x scripts/apply_research_iteration.py scripts/patch_iteration_site.py scripts/validate_iteration.py
          make validate
      - name: Commit the applied release
        run: |
          rm -rf .iteration-bundle
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git commit -m "Build the 0.7 network iteration" -m "Add Principia Cybernetica, canonical sources, provisional network neighbourhoods, richer map controls, and curator-approved participation and agent protocols."
          git push origin HEAD:release-0.7-constellation-alpha
