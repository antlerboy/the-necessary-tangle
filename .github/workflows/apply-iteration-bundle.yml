name: Apply the 0.17 complete update

on:
  push:
    branches: ["agent/complete-update-0.17"]
    paths:
      - ".github/workflows/apply-iteration-bundle.yml"
      - ".iteration-bundle/**"

permissions:
  contents: write

concurrency:
  group: apply-complete-update-0.17
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: agent/complete-update-0.17
          fetch-depth: 0
      - name: Reconstruct and validate the complete release
        run: |
          cat .iteration-bundle/part-* | base64 --decode > /tmp/tangle-0.17-update.tar.gz
          echo "256bc3d0a788a3bfcbe20cdbcb72f58b8ea79200ef63df5e608fc2f19e9b4375  /tmp/tangle-0.17-update.tar.gz" | sha256sum --check -
          tar -xzf /tmp/tangle-0.17-update.tar.gz -C .
          chmod +x scripts/apply_iteration_17.py scripts/patch_iteration_17.py scripts/validate_iteration_17.py
          make validate
      - name: Commit the generated release
        run: |
          rm -rf .iteration-bundle .github/workflows/apply-iteration-bundle.yml
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git commit -m "Publish 0.17 public intake and canon update" -m "Add public submissions and responses, Surprise me navigation, canon and lineage review, expanded critical systems history, the first structured submission projection, and the second bounded company-knowledge discovery pass."
          git push origin HEAD:agent/complete-update-0.17
