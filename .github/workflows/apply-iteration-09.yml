name: Apply iteration 0.9 feedback and AI observations

on:
  push:
    branches: ["agent/iteration-09-ai-observations"]
    paths:
      - ".github/workflows/apply-iteration-09.yml"
      - "scripts/apply_iteration_09.py"
      - "scripts/fix_iteration_09_edge_cases.py"
      - "scripts/patch_iteration_09.py"
      - "scripts/prepare_iteration_09_release.py"
      - "scripts/refresh_graph_snapshot.py"
      - "scripts/validate_iteration_09.py"

permissions:
  contents: write

concurrency:
  group: apply-iteration-09
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out iteration branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-09-ai-observations
          fetch-depth: 0

      - name: Prepare the durable release build
        run: python3 scripts/prepare_iteration_09_release.py

      - name: Resolve baseline and generated-link edge cases
        run: python3 scripts/fix_iteration_09_edge_cases.py

      - name: Build and validate twice
        run: |
          make validate
          make validate
          git diff --check

      - name: Verify the release contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text())
          assert data['meta']['release'] == '0.9-observations-alpha'
          assert data['meta']['public_entry_count'] == 411
          assert data['meta']['profile_count'] >= 32
          assert data['meta']['journey_count'] == 12
          assert data['graph_snapshot']['public_node_count'] == 411
          assert len(data['ai_observations']['observations']) >= 9
          assert len(data['ai_observations']['public_risks']) >= 10
          assert len(data['source_mining_register']) >= 14
          print(json.dumps({
              'release': data['meta']['release'],
              'entries': data['meta']['public_entry_count'],
              'profiles': data['meta']['profile_count'],
              'journeys': data['meta']['journey_count'],
              'sources': data['meta']['source_count'],
              'observations': len(data['ai_observations']['observations']),
              'risks': len(data['ai_observations']['public_risks']),
              'graph_snapshot': data['graph_snapshot'],
          }, indent=2))
          PY

      - name: Remove analysis and one-shot construction files
        run: |
          rm -rf analysis
          rm -f .github/workflows/analyse-iteration-09.yml
          rm -f .github/workflows/dump-iteration-09-schema.yml
          rm -f .github/workflows/apply-iteration-09.yml
          rm -f scripts/fix_iteration_09_edge_cases.py
          rm -f scripts/prepare_iteration_09_release.py

      - name: Commit the validated iteration
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish iteration 0.9 AI observations" -m "Apply the running feedback: public AI observations, explicit graph layers, publication risks, source-mining register, four developed social-complexity entries, four guided journeys, real internal links, pointer-centred zoom and left-aligned panels."
          git push origin HEAD:agent/iteration-09-ai-observations
