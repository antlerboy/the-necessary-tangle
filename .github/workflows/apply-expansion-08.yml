name: Apply 0.8 breadth expansion

on:
  push:
    branches: ["agent/expand-tangle-400"]
    paths:
      - ".github/workflows/apply-expansion-08.yml"
      - "scripts/prepare_expansion_08.py"
      - "scripts/apply_expansion_08.py"
      - "scripts/patch_expansion_08.py"
      - "scripts/validate_expansion_08.py"
      - "scripts/validate_constellation.py"

permissions:
  contents: write

concurrency:
  group: apply-expansion-08
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out expansion branch
        uses: actions/checkout@v7
        with:
          ref: agent/expand-tangle-400
          fetch-depth: 0

      - name: Mount the superseded branch as a read-only candidate source
        run: |
          git fetch origin release-0.7-constellation-alpha:refs/remotes/origin/release-0.7-constellation-alpha
          git worktree add --detach /tmp/oldwork origin/release-0.7-constellation-alpha

      - name: Prepare the durable release seed and build wiring
        run: python3 scripts/prepare_expansion_08.py /tmp/oldwork

      - name: Build and validate the expansion twice
        run: |
          make validate
          make validate
          git diff --check

      - name: Verify the release contract
        run: python3 scripts/validate_expansion_08.py

      - name: Remove diagnostic scaffolding
        run: |
          rm -rf analysis
          rm -f .github/workflows/analyse-expansion-candidates.yml
          rm -f .github/workflows/analyse-fpcs-authors.yml
          rm -f .github/workflows/apply-expansion-08.yml
          rm -f scripts/prepare_expansion_08.py

      - name: Commit the validated release branch
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Expand The Necessary Tangle to 407 public entries" -m "Add 203 evidence-gated bibliographic entries from the official Foundational Papers inventory, typed authorship and collection structure, adaptive map movement, full-map entry from the home page and a subtler curator-note link. Preserve the 0.7 core while making the build idempotent for later growth."
          git push origin HEAD:agent/expand-tangle-400
