name: Export iteration 0.13 candidate source

on:
  push:
    branches: ["agent/iteration-13-expertise-final"]
    paths:
      - ".github/workflows/export-iteration-13-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-13-expertise-final
          fetch-depth: 0
      - name: Pack candidate source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=scripts/__pycache__ \
            --exclude=validation \
            -czf /tmp/iteration-13-candidate-source.tar.gz .
          sha256sum /tmp/iteration-13-candidate-source.tar.gz > /tmp/iteration-13-candidate-source.sha256
      - name: Upload candidate source
        uses: actions/upload-artifact@v6
        with:
          name: iteration-13-candidate-source
          path: |
            /tmp/iteration-13-candidate-source.tar.gz
            /tmp/iteration-13-candidate-source.sha256
          if-no-files-found: error
          retention-days: 1
