name: Repair canonical light theme

on:
  push:
    branches: ["agent/light-theme-repair"]
    paths:
      - ".github/workflows/light-theme-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/light-theme-repair
          fetch-depth: 0
      - name: Repair CSS token
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/@mediox-sizing: border-box; }/* { box-sizing: border-box; }/' docs/assets/styles.css
          grep -F '* { box-sizing: border-box; }' docs/assets/styles.css
          ! grep -F '@mediox' docs/assets/styles.css
          ! grep -F 'prefers-color-scheme: dark' docs/assets/styles.css
          grep -F 'color-scheme: light;' docs/assets/styles.css
      - name: Validate complete release
        run: make validate
      - name: Verify post-build CSS integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -F '* { box-sizing: border-box; }' docs/assets/styles.css
          ! grep -F '@mediox' docs/assets/styles.css
          ! grep -F 'prefers-color-scheme: dark' docs/assets/styles.css
          grep -F 'color-scheme: light;' docs/assets/styles.css
          git diff --check
      - name: Commit repaired stylesheet
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/light-theme-repair.yml
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add docs/assets/styles.css .github/workflows/light-theme-repair.yml
          git diff --cached --check
          git commit -m "Repair light-theme stylesheet syntax"
          git push origin HEAD:agent/light-theme-repair
