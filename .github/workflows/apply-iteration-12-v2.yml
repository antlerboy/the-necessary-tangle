name: Apply iteration 0.12 practitioner intake v2

on:
  push:
    branches: ["agent/iteration-12-practitioner-intake"]
    paths:
      - ".github/workflows/apply-iteration-12-v2.yml"
      - ".iteration12-bundle/**"

permissions:
  contents: write

concurrency:
  group: apply-iteration-12-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out iteration branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-12-practitioner-intake
          fetch-depth: 0

      - name: Recover and inspect source bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import itertools
          import pathlib
          import re
          import tarfile

          root = pathlib.Path('.iteration12-bundle')
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.b64', '.base64', '.txt'})
          expected_size = 54715
          expected_sha = 'b30071976cb536ad9c1c4a5023e2ca6828d179ace8fac185e2085095e5c7bc1a'

          def clean(path):
              text = path.read_text(encoding='utf-8', errors='ignore')
              return re.sub(r'[^A-Za-z0-9+/=]', '', text)

          def decode_text(parts):
              text = ''.join(clean(p) for p in parts)
              text += '=' * ((4 - len(text) % 4) % 4)
              try:
                  return base64.b64decode(text, validate=False)
              except Exception:
                  return None

          def decode_parts(parts):
              out = bytearray()
              for p in parts:
                  text = clean(p)
                  text += '=' * ((4 - len(text) % 4) % 4)
                  try:
                      out.extend(base64.b64decode(text, validate=False))
                  except Exception:
                      return None
              return bytes(out)

          candidates = []
          for p in files:
              candidates.append((f'individual:{p}', decode_text([p])))
          if files:
              candidates.append(('all-text-concatenated', decode_text(files)))
              candidates.append(('all-parts-decoded', decode_parts(files)))
          if 1 < len(files) <= 7:
              for length in range(2, len(files) + 1):
                  for parts in itertools.permutations(files, length):
                      candidates.append(('text:' + ','.join(map(str, parts)), decode_text(parts)))
                      candidates.append(('bytes:' + ','.join(map(str, parts)), decode_parts(parts)))

          selected = None
          for label, data in candidates:
              if data is None:
                  continue
              digest = hashlib.sha256(data).hexdigest()
              if len(data) == expected_size and digest == expected_sha:
                  selected = (label, data)
                  break

          if selected is None:
              print('Bundle files found:')
              for p in files:
                  text = clean(p)
                  print(f'- {p}: raw={p.stat().st_size} cleaned={len(text)}')
              print('Candidate decoded sizes and hashes:')
              seen = set()
              for label, data in candidates:
                  if data is None:
                      continue
                  key = (len(data), hashlib.sha256(data).hexdigest())
                  if key in seen:
                      continue
                  seen.add(key)
                  print(f'- {label}: size={key[0]} sha256={key[1]}')
              raise SystemExit('No reconstruction matched the staged bundle contract')

          label, data = selected
          archive = pathlib.Path('/tmp/iteration-12-source.tar.gz')
          archive.write_bytes(data)
          print(f'Recovered source bundle using {label}')
          print(f'size={len(data)} sha256={hashlib.sha256(data).hexdigest()}')

          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('Iteration source bundle is empty')
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
              print(f'Validated {len(members)} source-bundle members')
              for member in members:
                  print(member.name)
              tf.extractall('.')
          PY

      - name: Prepare durable release build
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/prepare_iteration_12_release.py ]; then
            python3 scripts/prepare_iteration_12_release.py
          fi
          test -f scripts/apply_iteration_12.py
          test -f scripts/patch_iteration_12.py
          test -f scripts/validate_iteration_12.py

      - name: Build and validate twice
        run: |
          make validate
          make validate
          git diff --check

      - name: Verify release contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          labels = {node.get('label', '') for node in data.get('nodes', [])}
          titles = {source.get('title', '') for source in data.get('sources', [])}
          index = Path('docs/index.html').read_text(encoding='utf-8')
          combined = json.dumps(data, ensure_ascii=False)

          release = data.get('meta', {}).get('release', '')
          assert release.startswith('0.12-'), release
          for label in (
              'Ivo Velitchkov',
              'Patrick Hoverstadt',
              'The Grammar of Systems',
              'The Fractal Organization',
              'Patterns of Strategy',
          ):
              assert label in labels or label in titles, label
          for phrase in (
              'survival of the viable',
              'natural drift',
              'explicit semantics',
              'Nodica',
              'site-generated',
          ):
              assert phrase.lower() in combined.lower(), phrase
          assert 'https://github.com/antlerboy/the-necessary-tangle/issues/2' in index
          assert data.get('meta', {}).get('public_entry_count', 0) >= 422
          assert data.get('meta', {}).get('source_count', 0) >= 108
          print(json.dumps({
              'release': release,
              'entries': data['meta']['public_entry_count'],
              'profiles': data['meta'].get('profile_count'),
              'sources': data['meta']['source_count'],
              'journeys': data['meta'].get('journey_count'),
              'graph_snapshot': data.get('graph_snapshot'),
          }, indent=2, sort_keys=True))
          PY

      - name: Remove staging and one-shot files
        run: |
          rm -rf .iteration12-bundle
          rm -f .github/workflows/apply-iteration-12.yml
          rm -f .github/workflows/apply-iteration-12-v2.yml
          rm -f scripts/prepare_iteration_12_release.py
          git status --short

      - name: Commit validated release
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish iteration 0.12 practitioner intake" -m "Add developed coverage of Ivo Velitchkov and Patrick Hoverstadt, incorporate the submitted viability correction, document explicit semantics and Nodica, reconcile site-generated issues with the running feedback and research queues, and provide a less forbidding route into the atlas."
          git push origin HEAD:agent/iteration-12-practitioner-intake
