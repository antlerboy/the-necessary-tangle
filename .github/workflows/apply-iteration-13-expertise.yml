name: Apply iteration 0.13 expertise and observations

on:
  push:
    branches: ["agent/iteration-13-expertise-observations"]
    paths:
      - ".github/workflows/apply-iteration-13-expertise.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-iteration-13-expertise
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-13-expertise-observations
          fetch-depth: 0

      - name: Reconstruct and apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release/iteration-13-patch-part-* | base64 --decode > /tmp/iteration-13.patch.xz
          test "$(wc -c < /tmp/iteration-13.patch.xz)" -eq 46384
          echo "f86a551af21eb47b552c241d2e7fc63310e7df77b568307a99f697cf96726b4c  /tmp/iteration-13.patch.xz" | sha256sum -c -
          xz -dc /tmp/iteration-13.patch.xz > /tmp/iteration-13.patch
          git apply --check /tmp/iteration-13.patch
          git apply /tmp/iteration-13.patch
          rm -rf .iteration-bundle
          rm -f documentation/feedback-ledger.md
          rm -f documentation/public-knowledge-for-*.md

      - name: Build, validate and prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          make validate
          find . -type f \
            ! -path './.git/*' \
            ! -path './scripts/__pycache__/*' \
            ! -path './.release/*' \
            ! -path './.github/workflows/apply-iteration-13-expertise.yml' \
            ! -path './validation/*' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/build-a.sha256
          make validate
          find . -type f \
            ! -path './.git/*' \
            ! -path './scripts/__pycache__/*' \
            ! -path './.release/*' \
            ! -path './.github/workflows/apply-iteration-13-expertise.yml' \
            ! -path './validation/*' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/build-b.sha256
          cmp /tmp/build-a.sha256 /tmp/build-b.sha256
          git diff --check

      - name: Verify release contract and public-language boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          meta = data['meta']
          assert meta['release'] == '0.13-expertise-observations-alpha'
          assert meta['generated'] == '2026-08-11'
          assert meta['public_entry_count'] == 464
          assert meta['profile_count'] == 80
          assert meta['source_count'] == 125
          assert meta['journey_count'] == 15
          assert len(data['edges']) == 955
          assert len(data['ai_observations']['observations']) == 11
          assert data['ai_observations']['release'] == meta['release']

          profiles = {profile['node_id']: profile for profile in data['profiles']}
          ivo = json.dumps(profiles['person_ivo_velitchkov']).casefold()
          patrick = json.dumps(profiles['person_patrick_hoverstadt']).casefold()
          assert all(term in ivo for term in ('viable organisation', 'requisite inefficiency', 'semantic'))
          assert all(term in patrick for term in ('viable system model', 'systems laws', 'strategy'))

          assert not Path('documentation/feedback-ledger.md').exists()
          assert not list(Path('documentation').glob('public-knowledge-for-*.md'))
          assert Path('documentation/publication-standards.md').exists()
          assert Path('documentation/expertise-additions.md').exists()

          print(json.dumps({
              'release': meta['release'],
              'entries': meta['public_entry_count'],
              'profiles': meta['profile_count'],
              'sources': meta['source_count'],
              'journeys': meta['journey_count'],
              'edges': len(data['edges']),
              'ai_observations': len(data['ai_observations']['observations']),
          }, indent=2, sort_keys=True))
          PY
          ! grep -RInEi \
            "the-necessary-tangle/issues/2([^0-9]|$)|OpenAI|ChatGPT|Ivo Velitchkov's site submission|Patrick Hoverstadt's absence|missed by an earlier release|running feedback thread|running comment thread|site submission #21|issue #21|private working exchanges|editorial backstory|broken intake loop|omission exposed|present without the person" \
            data docs documentation README.md ACKNOWLEDGEMENTS.md CHANGELOG.md CITATION.cff

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/apply-iteration-13-expertise.yml
          rm -rf scripts/__pycache__
          git config user.name "Benjamin P Taylor"
          git config user.email "benjamin.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish iteration 0.13 expertise and observations" -m "Add expertise-led entries and typed practice relations, regenerate graph observations on every build, deepen inquiry, boundary, governance and intervention routes, and keep public profiles grounded in work and evidence."
          git push origin HEAD:agent/iteration-13-expertise-observations
