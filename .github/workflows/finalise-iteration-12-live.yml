name: Finalise iteration 0.12 live release

on:
  push:
    branches: ["agent/finalise-iteration-12-live"]
    paths:
      - ".github/workflows/finalise-iteration-12-live.yml"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalise-iteration-12-live
  cancel-in-progress: false

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalisation branch
        uses: actions/checkout@v7
        with:
          ref: agent/finalise-iteration-12-live
          fetch-depth: 0

      - name: Validate the complete release twice
        run: |
          set -euo pipefail
          test -f scripts/apply_iteration_12.py
          test -f scripts/patch_iteration_12.py
          test -f scripts/validate_iteration_12.py
          make validate
          make validate
          git diff --check

      - name: Verify content and write the live verification record
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          meta = data.get('meta', {})
          labels = {n.get('label', '') for n in data.get('nodes', [])}
          titles = {s.get('title', '') for s in data.get('sources', [])}
          text = json.dumps(data, ensure_ascii=False).lower()
          index = Path('docs/index.html').read_text(encoding='utf-8')
          release = str(meta.get('release', ''))

          assert release.startswith('0.12-'), release
          assert {'Ivo Velitchkov', 'Patrick Hoverstadt'} <= labels
          for work in ('The Grammar of Systems', 'The Fractal Organization', 'Patterns of Strategy'):
              assert work in labels or work in titles, work
          for phrase in ('survival of the viable', 'natural drift', 'explicit semantics', 'nodica', 'issues/21'):
              assert phrase in text, phrase
          assert 'https://github.com/antlerboy/the-necessary-tangle/issues/2' in index
          assert int(meta.get('public_entry_count', 0)) >= 422
          assert int(meta.get('source_count', 0)) >= 108

          graph = data.get('graph_snapshot', {})
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          edge_count = meta.get('public_edge_count', len(data.get('edges', [])))
          summary = {
              'release': release,
              'source_commit': commit,
              'entries': meta.get('public_entry_count'),
              'profiles': meta.get('profile_count'),
              'sources': meta.get('source_count'),
              'journeys': meta.get('journey_count'),
              'typed_edges': edge_count,
              'substantive_edges': graph.get('substantive_edge_count'),
              'connected_entries': graph.get('connected_node_count'),
              'isolated_entries': graph.get('isolated_node_count'),
          }
          Path('/tmp/iteration-12-summary.json').write_text(json.dumps(summary), encoding='utf-8')
          record = f'''# Iteration 0.12 live verification

This record was generated by a clean GitHub Actions build immediately before the final release-state pull request was merged.

- Release: `{release}`
- Source commit checked: `{commit}`
- Canonical public entries: {summary['entries']}
- Developed profiles: {summary['profiles']}
- Public sources: {summary['sources']}
- Guided journeys: {summary['journeys']}
- Typed public edges: {summary['typed_edges']}
- Substantive edge records: {summary['substantive_edges']}
- Substantively connected entries: {summary['connected_entries']}
- Substantive isolates: {summary['isolated_entries']}

The complete release and regression suite passed twice. The gate also checked:

- developed entries for Ivo Velitchkov and Patrick Hoverstadt;
- separate representation of *The Grammar of Systems*, *The Fractal Organization* and *Patterns of Strategy*;
- attribution and treatment of site contribution issue #21;
- viability, fitness and natural drift distinctions;
- explicit graph semantics and the Nodica comparison;
- the discreet running-feedback route;
- the three-feed intake rule covering curator comments, site submissions and standing research issues.
'''
          Path('documentation/iteration-12-live-verification.md').write_text(record, encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Remove temporary construction and superseded verification files
        run: |
          set -euo pipefail
          rm -rf .iteration12-bundle
          rm -f .iteration12-marker
          rm -f .github/iteration12-pr-body.md
          rm -f .github/pull_request_template_iteration12.md
          rm -f .github/ISSUE_TEMPLATE/config-iteration12-note.txt
          rm -f documentation/_iteration12-ready.md
          rm -f documentation/_iteration12-pr.md
          rm -f documentation/_ready-for-pr.txt
          rm -f documentation/_pr-now.txt
          rm -f documentation/_stop-adding-files.txt
          rm -f documentation/_this-should-not-exist.md
          rm -f documentation/_accidental-marker.md
          rm -f documentation/iteration12-progress.md
          rm -f documentation/validation-note-012.md
          rm -f .github/workflows/apply-iteration-12.yml
          rm -f .github/workflows/apply-iteration-12-v2.yml
          rm -f .github/workflows/apply-iteration-12-v3.yml
          rm -f .github/workflows/finalise-iteration-12-when-ready.yml
          rm -f .github/workflows/release-gate-iteration-12.yml
          rm -f .github/workflows/verify-iteration-12.yml
          rm -f .github/workflows/iteration12-trigger.yml
          rm -f .github/workflows/cleanup-iteration12-temporary.yml
          rm -f .github/workflows/cleanup-iteration12-final.yml
          rm -f .github/workflows/cleanup-pr22.yml
          rm -f .github/workflows/verify-iteration-12-release.yml
          rm -f .github/workflows/auto-merge-iteration-12-verification.yml
          rm -f .github/workflows/finalise-iteration-12-live.yml
          git diff --check

      - name: Commit clean final release state
        run: |
          set -euo pipefail
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Finalise iteration 0.12 live release"
            git push origin HEAD:agent/finalise-iteration-12-live
          fi

      - name: Wait for the pull request and squash merge it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=""
          for attempt in $(seq 1 30); do
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head agent/finalise-iteration-12-live --state open --json number --jq '.[0].number // empty')"
            if [ -n "$pr" ]; then break; fi
            sleep 2
          done
          test -n "$pr"
          gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" || true
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --subject "Finalise iteration 0.12 live release" --body "Keep the independently validated release record and remove temporary construction artefacts."
          merge_sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$merge_sha"
          echo "MERGE_SHA=$merge_sha" >> "$GITHUB_ENV"

      - name: Dispatch and wait for Pages and content-backup workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run content-backup.yml --repo "$GITHUB_REPOSITORY" --ref main

          pages_ok=""
          backup_ok=""
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=30")"
            pages_status="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.path==".github/workflows/pages.yml")][0].status // empty')"
            pages_result="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.path==".github/workflows/pages.yml")][0].conclusion // empty')"
            backup_status="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.path==".github/workflows/content-backup.yml")][0].status // empty')"
            backup_result="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.path==".github/workflows/content-backup.yml")][0].conclusion // empty')"
            echo "Pages: ${pages_status:-not-started}/${pages_result:-none}; backup: ${backup_status:-not-started}/${backup_result:-none}"
            if [ "$pages_result" = "failure" ] || [ "$pages_result" = "cancelled" ]; then exit 1; fi
            if [ "$backup_result" = "failure" ] || [ "$backup_result" = "cancelled" ]; then exit 1; fi
            if [ "$pages_status" = "completed" ] && [ "$pages_result" = "success" ]; then pages_ok=yes; fi
            if [ "$backup_status" = "completed" ] && [ "$backup_result" = "success" ]; then backup_ok=yes; fi
            if [ "$pages_ok" = yes ] && [ "$backup_ok" = yes ]; then break; fi
            sleep 10
          done
          test "$pages_ok" = yes
          test "$backup_ok" = yes

      - name: Reconcile the accepted submission and running feedback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(jq -r '.release' /tmp/iteration-12-summary.json)"
          entries="$(jq -r '.entries' /tmp/iteration-12-summary.json)"
          profiles="$(jq -r '.profiles' /tmp/iteration-12-summary.json)"
          sources="$(jq -r '.sources' /tmp/iteration-12-summary.json)"
          journeys="$(jq -r '.journeys' /tmp/iteration-12-summary.json)"
          edges="$(jq -r '.typed_edges' /tmp/iteration-12-summary.json)"
          substantive="$(jq -r '.substantive_edges' /tmp/iteration-12-summary.json)"
          connected="$(jq -r '.connected_entries' /tmp/iteration-12-summary.json)"
          isolated="$(jq -r '.isolated_entries' /tmp/iteration-12-summary.json)"

          issue21_marker='<!-- iteration-012-issue-21-complete -->'
          if ! gh api "repos/$GITHUB_REPOSITORY/issues/21/comments" --paginate --jq '.[].body' | grep -Fq "$issue21_marker"; then
            cat > /tmp/issue21-comment.md <<EOF
          $issue21_marker
          Accepted into **$release**.

          Your site submission exposed both a content issue and an intake failure. The release now:

          - distinguishes viability from a loose ‘fitness’ slogan;
          - adds natural drift as a linked concept rather than a synonym for natural selection;
          - attributes this correction to issue #21;
          - develops Ivo Velitchkov as a public person entry and connects the contribution to his wider public work;
          - documents a three-feed release rule so site-generated issues are reviewed alongside the curator thread and standing research programmes.

          The published wording retains the caveat that natural drift does not simply abolish every technical use of selection or fitness.
          EOF
            gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue21-comment.md
          fi
          gh issue close 21 --repo "$GITHUB_REPOSITORY" --reason completed || true

          issue2_marker='<!-- iteration-012-release-complete -->'
          if ! gh api "repos/$GITHUB_REPOSITORY/issues/2/comments" --paginate --jq '.[].body' | grep -Fq "$issue2_marker"; then
            cat > /tmp/issue2-comment.md <<EOF
          $issue2_marker
          Iteration **$release** is published and independently validated.

          Added now:

          - developed entries for Ivo Velitchkov and Patrick Hoverstadt;
          - separate entries for *The Grammar of Systems*, *The Fractal Organization* and *Patterns of Strategy*;
          - the accepted viability / natural-drift correction from site submission #21;
          - explicit-semantics documentation and Nodica as an RDF graph comparator;
          - a three-feed intake rule covering this thread, site-generated issues and standing research issues;
          - a calmer progressive-disclosure route before the full graph.

          Current release: $entries entries, $profiles developed profiles, $sources sources, $edges typed edges, $substantive substantive edge records, $journeys guided journeys, $connected substantively connected entries and $isolated substantive isolates.

          GitHub Pages and the validated content-backup workflow completed successfully.

          Still open as item-level programmes rather than falsely claimed complete: SCiO methods and people; Benjamin's reading list and public sources; apprenticeship-workbook references; Roger James's public source collection; CYBCOM/CybSoc/ASC archives; Arthur Battram; Monoskop; SysCoI/model.report; prior maps; and deeper practitioner lineages.
          EOF
            gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue2-comment.md
          fi

          gh pr close 20 --repo "$GITHUB_REPOSITORY" --comment "Superseded by the validated iteration 0.12 release; this draft was never merged." || true
          gh pr close 23 --repo "$GITHUB_REPOSITORY" --comment "Superseded by the final live verification pull request." || true
