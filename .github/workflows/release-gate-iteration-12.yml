name: Release gate for iteration 0.12

on:
  push:
    branches: ["agent/iteration-12-practitioner-intake"]
    paths:
      - ".github/workflows/release-gate-iteration-12.yml"

permissions:
  contents: write

concurrency:
  group: release-gate-iteration-12
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/iteration-12-practitioner-intake
          fetch-depth: 0

      - name: Recover durable iteration files if required
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply_iteration_12.py ] && [ -f scripts/patch_iteration_12.py ] && [ -f scripts/validate_iteration_12.py ]; then
            echo "Durable iteration files already present."
            exit 0
          fi
          python3 - <<'PY'
          import base64, hashlib, itertools, pathlib, re, tarfile, tempfile
          files=sorted(p for p in pathlib.Path('.iteration12-bundle').rglob('*') if p.is_file())
          if not files: raise SystemExit('No staged source files')
          def clean(p): return re.sub(r'[^A-Za-z0-9+/=]','',p.read_text(errors='ignore'))
          def decode(parts,separate):
              try:
                  if separate:
                      out=bytearray()
                      for p in parts:
                          s=clean(p); s+='='*((4-len(s)%4)%4); out.extend(base64.b64decode(s,validate=False))
                      return bytes(out)
                  s=''.join(clean(p) for p in parts); s+='='*((4-len(s)%4)%4)
                  return base64.b64decode(s,validate=False)
              except Exception: return b''
          attempts=[]
          for p in files: attempts.append(((p,),False))
          attempts.extend([(tuple(files),False),(tuple(files),True)])
          if len(files)<=8:
              for n in range(2,len(files)+1):
                  for ps in itertools.permutations(files,n): attempts.extend([(ps,False),(ps,True)])
          seen=set()
          for ps,separate in attempts:
              payload=decode(ps,separate)
              if not payload: continue
              digest=hashlib.sha256(payload).hexdigest()
              if digest in seen: continue
              seen.add(digest)
              path=pathlib.Path(tempfile.gettempdir())/f'i12-{digest[:12]}.tgz'; path.write_bytes(payload)
              try:
                  with tarfile.open(path,'r:gz') as tf:
                      names={m.name for m in tf.getmembers()}
                      required={'scripts/apply_iteration_12.py','scripts/patch_iteration_12.py','scripts/validate_iteration_12.py'}
                      if not required.issubset(names): continue
                      for m in tf.getmembers():
                          pp=pathlib.PurePosixPath(m.name)
                          if pp.is_absolute() or '..' in pp.parts: raise SystemExit(f'unsafe archive path: {m.name}')
                      print('Recovered archive',len(payload),digest,[str(p) for p in ps],separate)
                      tf.extractall('.')
                      break
              except (tarfile.TarError,OSError): continue
          else:
              raise SystemExit('No complete source archive could be reconstructed')
          PY
          if [ -f scripts/prepare_iteration_12_release.py ]; then
            python3 scripts/prepare_iteration_12_release.py
          fi

      - name: Run complete release validation twice
        run: |
          test -f scripts/apply_iteration_12.py
          test -f scripts/patch_iteration_12.py
          test -f scripts/validate_iteration_12.py
          make validate
          make validate
          git diff --check

      - name: Check the accepted feedback and submission
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/public-data.json').read_text())
          meta=d.get('meta',{})
          labels={n.get('label','') for n in d.get('nodes',[])}
          text=json.dumps(d,ensure_ascii=False).lower()
          index=Path('docs/index.html').read_text()
          assert str(meta.get('release','')).startswith('0.12-')
          assert {'Ivo Velitchkov','Patrick Hoverstadt'} <= labels
          for phrase in ('the grammar of systems','the fractal organization','patterns of strategy','survival of the viable','natural drift','explicit semantics','nodica','issues/21'):
              assert phrase in text, phrase
          assert 'https://github.com/antlerboy/the-necessary-tangle/issues/2' in index
          assert int(meta.get('public_entry_count',0)) >= 422
          assert int(meta.get('source_count',0)) >= 108
          print(json.dumps({'meta':meta,'graph_snapshot':d.get('graph_snapshot')},indent=2,sort_keys=True))
          PY

      - name: Remove all temporary construction files
        run: |
          rm -rf .iteration12-bundle
          find .github/workflows -maxdepth 1 -type f -name '*iteration-12*.yml' -delete
          rm -f scripts/prepare_iteration_12_release.py
          git status --short

      - name: Commit the validated release state
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No release changes to commit."
          else
            git commit -m "Publish iteration 0.12 practitioner intake" -m "Add developed coverage of Ivo Velitchkov and Patrick Hoverstadt, incorporate the submitted viability correction, document explicit semantics and Nodica, reconcile site-generated issues with the running feedback and research queues, and provide a less forbidding route into the atlas."
            git push origin HEAD:agent/iteration-12-practitioner-intake
          fi
