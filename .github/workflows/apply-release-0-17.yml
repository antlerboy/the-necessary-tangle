name: Prepare and validate release branch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: prepare-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-release:
    if: startsWith(github.event.pull_request.head.ref, 'agent/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install media inspection dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build and validate the complete release
        env:
          TANGLE_REFRESH_COMPLEXITY_PODCAST: "1"
        run: make validate

      - name: Commit generated release artefacts
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "The release branch is already generated and validated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate and validate the release artefact"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
