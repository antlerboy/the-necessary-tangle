name: Finalise 0.8 interface

on:
  push:
    branches: ["agent/expand-tangle-400"]
    paths:
      - ".github/workflows/finalise-expansion-ui.yml"
      - "scripts/fix_expansion_ui.py"

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/expand-tangle-400
          fetch-depth: 0

      - name: Correct the build source and regenerate the public site
        run: |
          python3 scripts/fix_expansion_ui.py
          make validate
          make validate
          git diff --check

      - name: Confirm the final interface contract
        run: python3 scripts/validate_expansion_08.py

      - name: Remove the one-shot finaliser
        run: |
          rm -f .github/workflows/finalise-expansion-ui.yml
          rm -f scripts/fix_expansion_ui.py

      - name: Commit the final interface state
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Default to the full adaptive map and conceal curator notes"
          git push origin HEAD:agent/expand-tangle-400
