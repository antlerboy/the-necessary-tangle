name: Apply iteration 0.12 practitioner intake

on:
  push:
    branches: ["agent/iteration-12-practitioner-intake"]
    paths:
      - ".github/workflows/apply-iteration-12.yml"
      - ".iteration12-bundle/**"

permissions:
  contents: write

concurrency:
  group: apply-iteration-12-practitioner-intake
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out iteration branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-12-practitioner-intake
          fetch-depth: 0

      - name: Reconstruct and inspect source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .iteration12-bundle/piece-00 \
            .iteration12-bundle/piece-01 \
            .iteration12-bundle/piece-02 \
            .iteration12-bundle/piece-03 \
            .iteration12-bundle/piece-04 \
            .iteration12-bundle/piece-05 \
            .iteration12-bundle/part-01 \
            .iteration12-bundle/part-02 \
            .iteration12-bundle/part-03 \
            .iteration12-bundle/part-04 \
            | base64 --decode > /tmp/iteration-12-source.tar.gz
          test "$(wc -c < /tmp/iteration-12-source.tar.gz)" -eq 54715
          echo "b30071976cb536ad9c1c4a5023e2ca6828d179ace8fac185e2085095e5c7bc1a  /tmp/iteration-12-source.tar.gz" | sha256sum -c -

          cat \
            .iteration12-bundle/validator-piece-00 \
            .iteration12-bundle/validator-piece-01 \
            | base64 --decode > /tmp/iteration-12-validator-fixes.tar.gz
          test "$(wc -c < /tmp/iteration-12-validator-fixes.tar.gz)" -eq 9628
          echo "7162d7ad5c32e40d06a6ec9a4ec46d7c7a387e680b3c59ca2c5bacbf3a38fc8e  /tmp/iteration-12-validator-fixes.tar.gz" | sha256sum -c -

          python3 - <<'PY'
          import pathlib, tarfile
          for archive in (
              '/tmp/iteration-12-source.tar.gz',
              '/tmp/iteration-12-validator-fixes.tar.gz',
          ):
              with tarfile.open(archive, 'r:gz') as tf:
                  members = tf.getmembers()
                  if not members:
                      raise SystemExit(f'Archive is empty: {archive}')
                  for member in members:
                      p = pathlib.PurePosixPath(member.name)
                      if p.is_absolute() or '..' in p.parts:
                          raise SystemExit(f'Unsafe archive path: {member.name}')
                  print(f'Validated {len(members)} members in {archive}')
          PY
          tar -xzf /tmp/iteration-12-source.tar.gz -C .
          tar -xzf /tmp/iteration-12-validator-fixes.tar.gz -C .

      - name: Build and validate twice
        run: |
          make validate
          make validate
          git diff --check

      - name: Verify release contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          index = Path('docs/index.html').read_text(encoding='utf-8')
          app = Path('docs/assets/app.js').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/triage-site-submissions.yml').read_text(encoding='utf-8')

          meta = data['meta']
          assert meta['release'] == '0.12-practitioner-intake-alpha'
          assert meta['public_entry_count'] == 442
          assert meta['profile_count'] == 58
          assert meta['journey_count'] == 14
          assert meta['source_count'] == 114
          assert len(data['edges']) == 917

          node_ids = {node['id'] for node in data['nodes']}
          for node_id in (
              'person_ivo_velitchkov',
              'person_patrick_hoverstadt',
              'publication_essential_balances',
              'concept_requisite_inefficiency',
              'concept_natural_drift',
              'publication_the_grammar_of_systems_ii',
              'publication_the_fractal_organization_manual',
              'concept_explicit_semantics',
              'tool_nodica',
          ):
              assert node_id in node_ids, node_id

          accepted = data.get('accepted_contributions', [])
          assert len(accepted) == 1
          assert accepted[0]['issue_number'] == 21
          assert accepted[0]['status'] == 'incorporated_with_independent_sources'
          assert data['contribution_intake']['feeds'][0]['type'] == 'running_feedback_thread'
          assert any(feed['type'] == 'site_generated_issue' for feed in data['contribution_intake']['feeds'])
          assert any(feed['type'] == 'standing_research_issue' for feed in data['contribution_intake']['feeds'])
          assert data['semantic_contract']['uses_explicit_semantics'] is True
          assert data['reading_list_coverage']['headline_recommendations_developed'] == 4
          assert data['scio_coverage']['approach_family_count'] == 13
          assert data['scio_coverage']['intervention_skill_count'] == 47

          assert index.count('https://github.com/antlerboy/the-necessary-tangle/issues/2') == 1
          assert 'class="feedback-dot"' in index
          assert 'Start somewhere smaller' in index
          assert 'Three feedback feeds' in index
          assert 'site-submission,awaiting-curator-review' in app
          assert 'site-submission' in workflow
          assert 'awaiting-curator-review' in workflow

          print(json.dumps({
              'release': meta['release'],
              'entries': meta['public_entry_count'],
              'profiles': meta['profile_count'],
              'sources': meta['source_count'],
              'journeys': meta['journey_count'],
              'edges': len(data['edges']),
              'accepted_contributions': len(accepted),
              'source_mining_programmes': len(data.get('source_mining_register', [])),
              'graph_snapshot': data['graph_snapshot'],
          }, indent=2, sort_keys=True))
          PY

      - name: Remove staging files and one-shot workflow
        run: |
          rm -rf .iteration12-bundle
          rm -f .github/workflows/apply-iteration-12.yml
          git status --short

      - name: Commit validated release
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish iteration 0.12 practitioner intake" -m "Add developed Ivo Velitchkov and Patrick Hoverstadt constellations, incorporate the submitted viability and natural-drift clarification, document explicit semantics and Nodica, deepen SCiO and reading-list coverage, reconcile three feedback feeds, and give readers a less forbidding route into the atlas."
          git push origin HEAD:agent/iteration-12-practitioner-intake
