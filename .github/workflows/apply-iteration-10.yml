name: Apply iteration 0.10 practice and safety

on:
  push:
    branches: ["agent/iteration-10-practice-safety"]
    paths:
      - ".github/workflows/apply-iteration-10.yml"
      - ".iteration10-bundle/**"

permissions:
  contents: write

concurrency:
  group: apply-iteration-10
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out iteration branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-10-practice-safety
          fetch-depth: 0

      - name: Reconstruct and inspect the iteration source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .iteration10-bundle/part-* | base64 --decode > /tmp/iteration10-source.tar.gz
          test "$(wc -c < /tmp/iteration10-source.tar.gz)" -eq 22076
          echo "00414674ca59ad55db1a9eaf7287f648f4538c2ced8c65f88d9c565e8ac6073a  /tmp/iteration10-source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/iteration10-source.tar.gz
          tar -xzf /tmp/iteration10-source.tar.gz -C .

      - name: Prepare the durable release build
        run: python3 scripts/prepare_iteration_10_release.py

      - name: Build and validate twice
        run: |
          make validate
          make validate
          git diff --check

      - name: Verify the release contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          index = Path('docs/index.html').read_text(encoding='utf-8')
          assert data['meta']['release'] == '0.10-practice-safety-alpha'
          assert data['meta']['public_entry_count'] == 417
          assert data['meta']['profile_count'] == 38
          assert data['meta']['journey_count'] == 13
          assert data['meta']['source_count'] == 100
          assert len(data.get('publication_controls', [])) == 6
          assert 'public_risks' not in data.get('ai_observations', {})
          assert '/issues/2' not in index
          for url in (
              'https://www.syscoi.com/',
              'https://www.systemspractice.org/professional-accreditation',
              'https://www.systemspractice.org/professional-development',
              'https://www.antlerboy.com/reading-list',
          ):
              assert url in index
          print(json.dumps({
              'release': data['meta']['release'],
              'entries': data['meta']['public_entry_count'],
              'profiles': data['meta']['profile_count'],
              'journeys': data['meta']['journey_count'],
              'sources': data['meta']['source_count'],
              'publication_controls': len(data.get('publication_controls', [])),
              'graph_snapshot': data['graph_snapshot'],
          }, indent=2, sort_keys=True))
          PY

      - name: Remove staging and one-shot construction files
        run: |
          rm -rf .iteration10-bundle
          rm -f .github/workflows/apply-iteration-10.yml
          rm -f scripts/prepare_iteration_10_release.py
          git status --short

      - name: Commit the validated iteration
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish iteration 0.10 practice and safety" -m "Distinguish six commonly conflated systems terms, add a guided route through them, provide prominent public pathways to SysCoI, SCiO capability and training, and the curator's reading list, and replace the public risk notebook with explicit publication controls and repository safeguards."
          git push origin HEAD:agent/iteration-10-practice-safety
