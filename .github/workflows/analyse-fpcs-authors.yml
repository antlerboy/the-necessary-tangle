name: Analyse Foundational Papers authors

on:
  push:
    branches: ["agent/expand-tangle-400"]
    paths:
      - ".github/workflows/analyse-fpcs-authors.yml"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/expand-tangle-400
          fetch-depth: 0

      - name: Mount superseded branch for its official collection inventory
        run: |
          git fetch origin release-0.7-constellation-alpha:refs/remotes/origin/release-0.7-constellation-alpha
          git worktree add --detach /tmp/oldwork origin/release-0.7-constellation-alpha

      - name: Count and map authors
        run: |
          python3 - <<'PY'
          import json
          import re
          import runpy
          import unicodedata
          from collections import defaultdict
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text())
          module = runpy.run_path('/tmp/oldwork/scripts/apply_research_iteration.py')
          papers = module['FPCS_PAPERS']

          def ascii_fold(value):
              return ''.join(
                  ch for ch in unicodedata.normalize('NFKD', value)
                  if not unicodedata.combining(ch)
              ).casefold()

          def clean(value):
              return re.sub(r'[^a-z0-9]+', ' ', ascii_fold(value)).strip()

          def split_authors(value):
              value = value.replace(', and ', ', ').replace(' and ', ', ')
              return [part.strip() for part in value.split(',') if part.strip()]

          def key_parts(label):
              words = clean(label).split()
              if not words:
                  return '', ''
              first_initial = words[0][0]
              surname = words[-1]
              return first_initial, surname

          redirects = data.get('canonical_redirects', {})
          public_people = [
              n for n in data.get('nodes', [])
              if n.get('entity_type') == 'person'
              and n.get('public_visibility') == 'public'
              and redirects.get(n['id'], n['id']) == n['id']
          ]
          by_initial_surname = defaultdict(list)
          for person in public_people:
              by_initial_surname[key_parts(person.get('label', ''))].append(person)

          paper_by_author = defaultdict(list)
          for paper in papers:
              for author in split_authors(paper['authors']):
                  paper_by_author[author].append({
                      'number': paper['number'],
                      'title': paper['title'],
                      'year': paper['year'],
                      'publication_id': f"publication_fpcs_{paper['number']:03d}",
                  })

          existing = []
          candidates = []
          ambiguous = []
          for author, authored_papers in sorted(paper_by_author.items(), key=lambda item: clean(item[0])):
              matches = by_initial_surname.get(key_parts(author), [])
              record = {'label': author, 'papers': authored_papers}
              if len(matches) == 1:
                  record['existing_id'] = matches[0]['id']
                  record['existing_label'] = matches[0]['label']
                  existing.append(record)
              elif len(matches) > 1:
                  record['possible_matches'] = [
                      {'id': item['id'], 'label': item['label']} for item in matches
                  ]
                  ambiguous.append(record)
              else:
                  candidates.append(record)

          payload = {
              'official_paper_count': len(papers),
              'unique_author_forms': len(paper_by_author),
              'matched_existing_people': len(existing),
              'ambiguous_author_forms': len(ambiguous),
              'new_author_candidates': len(candidates),
              'existing': existing,
              'ambiguous': ambiguous,
              'candidates': candidates,
          }
          Path('analysis/fpcs-author-candidates.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n'
          )

          lines = [
              '# Foundational Papers author analysis', '',
              f"- Official papers: {len(papers)}",
              f"- Unique author forms in the official inventory: {len(paper_by_author)}",
              f"- Matched to existing public people: {len(existing)}",
              f"- Ambiguous matches needing caution: {len(ambiguous)}",
              f"- New bibliographic person candidates: {len(candidates)}", '',
              '## New author candidates', '',
          ]
          for item in candidates:
              papers_text = '; '.join(p['title'] for p in item['papers'])
              lines.append(f"- {item['label']} — {papers_text}")
          lines += ['', '## Existing matches', '']
          for item in existing:
              lines.append(f"- {item['label']} → {item['existing_label']} (`{item['existing_id']}`)")
          lines += ['', '## Ambiguous matches', '']
          for item in ambiguous:
              labels = ', '.join(m['label'] for m in item['possible_matches'])
              lines.append(f"- {item['label']} → {labels}")
          Path('analysis/fpcs-author-report.md').write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit author analysis
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add analysis/fpcs-author-candidates.json analysis/fpcs-author-report.md
          git commit -m "Analyse Foundational Papers author candidates"
          git push origin HEAD:agent/expand-tangle-400
