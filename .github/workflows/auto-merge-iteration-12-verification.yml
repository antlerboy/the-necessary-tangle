name: Validate, clean and merge iteration 0.12 verification

on:
  push:
    branches: ["agent/verify-iteration-12-release"]
    paths:
      - ".github/workflows/auto-merge-iteration-12-verification.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-merge-iteration-12-verification
  cancel-in-progress: false

jobs:
  validate-clean-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v7
        with:
          ref: agent/verify-iteration-12-release
          fetch-depth: 0

      - name: Validate complete release twice
        run: |
          set -euo pipefail
          test -f scripts/apply_iteration_12.py
          test -f scripts/patch_iteration_12.py
          test -f scripts/validate_iteration_12.py
          make validate
          make validate
          git diff --check

      - name: Verify contract and generate release record
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          meta = data.get('meta', {})
          labels = {n.get('label', '') for n in data.get('nodes', [])}
          titles = {s.get('title', '') for s in data.get('sources', [])}
          text = json.dumps(data, ensure_ascii=False).lower()
          index = Path('docs/index.html').read_text(encoding='utf-8')
          release = str(meta.get('release', ''))

          assert release.startswith('0.12-'), release
          assert {'Ivo Velitchkov', 'Patrick Hoverstadt'} <= labels
          for work in ('The Grammar of Systems', 'The Fractal Organization', 'Patterns of Strategy'):
              assert work in labels or work in titles, work
          for phrase in ('survival of the viable', 'natural drift', 'explicit semantics', 'nodica', 'issues/21'):
              assert phrase in text, phrase
          assert 'https://github.com/antlerboy/the-necessary-tangle/issues/2' in index
          assert int(meta.get('public_entry_count', 0)) >= 422
          assert int(meta.get('source_count', 0)) >= 108

          graph = data.get('graph_snapshot', {})
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          edge_count = meta.get('public_edge_count', len(data.get('edges', [])))
          record = f'''# Iteration 0.12 verification

This record was generated by a clean GitHub Actions build from the release branch immediately before the verification pull request was merged.

- Release: `{release}`
- Source commit checked: `{commit}`
- Canonical public entries: {meta.get('public_entry_count')}
- Developed profiles: {meta.get('profile_count')}
- Public sources: {meta.get('source_count')}
- Guided journeys: {meta.get('journey_count')}
- Typed public edges: {edge_count}
- Substantive edge records: {graph.get('substantive_edge_count')}
- Substantively connected entries: {graph.get('connected_node_count')}
- Substantive isolates: {graph.get('isolated_node_count')}

The complete release and regression suite passed twice. The gate also checked:

- developed entries for Ivo Velitchkov and Patrick Hoverstadt;
- separate representation of *The Grammar of Systems*, *The Fractal Organization* and *Patterns of Strategy*;
- attribution and treatment of site contribution issue #21;
- viability, fitness and natural drift distinctions;
- explicit graph semantics and the Nodica comparison;
- the discreet running-feedback route.
'''
          Path('documentation/iteration-12-verification.md').write_text(record, encoding='utf-8')
          print(json.dumps({'release': release, 'meta': meta, 'graph_snapshot': graph}, indent=2, sort_keys=True))
          PY

      - name: Remove all temporary construction and verification files
        run: |
          set -euo pipefail
          rm -rf .iteration12-bundle
          rm -f .iteration12-marker
          rm -f .github/iteration12-pr-body.md
          rm -f .github/pull_request_template_iteration12.md
          rm -f .github/ISSUE_TEMPLATE/config-iteration12-note.txt
          rm -f documentation/_iteration12-ready.md
          rm -f documentation/_iteration12-pr.md
          rm -f documentation/_ready-for-pr.txt
          rm -f documentation/_pr-now.txt
          rm -f documentation/_stop-adding-files.txt
          rm -f documentation/_this-should-not-exist.md
          rm -f documentation/_accidental-marker.md
          rm -f documentation/iteration12-progress.md
          rm -f documentation/validation-note-012.md
          rm -f .github/workflows/apply-iteration-12.yml
          rm -f .github/workflows/apply-iteration-12-v2.yml
          rm -f .github/workflows/apply-iteration-12-v3.yml
          rm -f .github/workflows/finalise-iteration-12-when-ready.yml
          rm -f .github/workflows/finalise-iteration-12-when-ready.yml
          rm -f .github/workflows/release-gate-iteration-12.yml
          rm -f .github/workflows/verify-iteration-12.yml
          rm -f .github/workflows/iteration12-trigger.yml
          rm -f .github/workflows/cleanup-iteration12-temporary.yml
          rm -f .github/workflows/cleanup-iteration12-final.yml
          rm -f .github/workflows/cleanup-pr22.yml
          rm -f .github/workflows/verify-iteration-12-release.yml
          rm -f .github/workflows/auto-merge-iteration-12-verification.yml
          git diff --check

      - name: Commit clean verified state
        run: |
          set -euo pipefail
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Verify and clean iteration 0.12 release"
            git push origin HEAD:agent/verify-iteration-12-release
          fi

      - name: Mark the pull request ready and squash merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head agent/verify-iteration-12-release --state open --json number --jq '.[0].number')"
          test -n "$pr"
          gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" || true
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --subject "Verify and clean iteration 0.12 release" --body "Record the independent double validation of the practitioner-intake release and remove temporary branch construction files."
