name: Validate light-theme hotfix

on:
  push:
    branches: ["agent/light-theme-hotfix"]
    paths:
      - ".github/workflows/light-theme-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v7
        with:
          ref: agent/light-theme-hotfix
          fetch-depth: 0

      - name: Force the canonical light palette
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css_path = Path('docs/assets/styles.css')
          css = css_path.read_text(encoding='utf-8')
          assert 'color-scheme: light dark;' in css
          start = css.index('@media (prefers-color-scheme: dark) {')
          end = css.index('* { box-sizing: border-box; }', start)
          css = css.replace('color-scheme: light dark;', 'color-scheme: light;', 1)
          css = css[:start] + css[end:]
          css_path.write_text(css, encoding='utf-8')
          index_path = Path('docs/index.html')
          index = index_path.read_text(encoding='utf-8')
          assert '<meta name="color-scheme" content="light dark">' in index
          assert '<link rel="stylesheet" href="assets/styles.css">' in index
          index = index.replace('<meta name="color-scheme" content="light dark">', '<meta name="color-scheme" content="light">', 1)
          index = index.replace('<link rel="stylesheet" href="assets/styles.css">', '<link rel="stylesheet" href="assets/styles.css?v=0.14.1-light">', 1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Run the complete existing validation
        shell: bash
        run: |
          set -euo pipefail
          make validate
          python3 - <<'PY'
          from pathlib import Path
          css = Path('docs/assets/styles.css').read_text(encoding='utf-8')
          index = Path('docs/index.html').read_text(encoding='utf-8')
          assert 'color-scheme: light dark' not in css
          assert 'prefers-color-scheme: dark' not in css
          assert '--bg: #181412' not in css
          assert 'color-scheme: light;' in css
          assert '<meta name="color-scheme" content="light">' in index
          assert 'assets/styles.css?v=0.14.1-light' in index
          PY
          git diff --check

      - name: Refuse unexpected generated changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v -E '^(docs/assets/styles.css|docs/index.html|.github/workflows/light-theme-hotfix.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during validation:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/light-theme-hotfix.yml
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add docs/assets/styles.css docs/index.html .github/workflows/light-theme-hotfix.yml
          git diff --cached --check
          git commit -m "Fix canonical light colour scheme" -m "Stop inheriting the operating-system dark palette, declare the warm light palette as canonical, and cache-bust the stylesheet so existing browsers receive the correction."
          git push origin HEAD:agent/light-theme-hotfix
