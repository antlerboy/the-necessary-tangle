name: Build iteration 0.15 candidate

on:
  push:
    branches: ["agent/iteration-15-ing-reading-practice"]
    paths:
      - ".github/workflows/apply-iteration-15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iteration-15-ing-reading-practice
  cancel-in-progress: false

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-15-ing-reading-practice
          fetch-depth: 0

      - name: Reconstruct and verify source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release/iteration15/part-* | base64 --decode > /tmp/iteration15-source.patch.xz
          test "$(wc -c < /tmp/iteration15-source.patch.xz)" -eq 30632
          echo "f7d31c43d491de647f87a5a40f08f705e4eeb7ad6464776925c76af08c3d25e6  /tmp/iteration15-source.patch.xz" | sha256sum -c -
          xz -dc /tmp/iteration15-source.patch.xz > /tmp/iteration15-source.patch
          git apply --check -p1 /tmp/iteration15-source.patch
          git apply -p1 /tmp/iteration15-source.patch
          test "$(wc -c < .release/iteration15/idempotency.patch)" -eq 1936
          echo "bb5200a4b7c61718a4409e26812750c5436b0bf46ccfb99c7cc7c546879c48f1  .release/iteration15/idempotency.patch" | sha256sum -c -
          git apply --check .release/iteration15/idempotency.patch
          git apply .release/iteration15/idempotency.patch

      - name: Build and validate
        shell: bash
        run: |
          set -euo pipefail
          make validate
          find . -type f \
            ! -path './.git/*' \
            ! -path './.release/*' \
            ! -path './validation/*' \
            ! -path './scripts/__pycache__/*' \
            ! -path './.github/workflows/apply-iteration-15.yml' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/build-a.sha256
          make build
          find . -type f \
            ! -path './.git/*' \
            ! -path './.release/*' \
            ! -path './validation/*' \
            ! -path './scripts/__pycache__/*' \
            ! -path './.github/workflows/apply-iteration-15.yml' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/build-b.sha256
          if ! cmp /tmp/build-a.sha256 /tmp/build-b.sha256; then
            echo 'Repeatability mismatch:'
            diff -u /tmp/build-a.sha256 /tmp/build-b.sha256 | head -100 || true
            exit 1
          fi
          git diff --check

      - name: Verify the 0.15 release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          published = json.loads(Path('docs/assets/public-data.json').read_text(encoding='utf-8'))
          reading = json.loads(Path('data/reading-list-inventory.json').read_text(encoding='utf-8'))
          meta = data['meta']

          assert meta == published['meta']
          assert meta['release'] == '0.15-ing-reading-practice-alpha'
          assert meta['generated'] == '2026-08-14'
          assert meta['public_entry_count'] == 495
          assert meta['described_entry_count'] == 495
          assert meta['profile_count'] == 111
          assert meta['source_count'] == 148
          assert meta['public_link_source_count'] == 135
          assert meta['journey_count'] == 18
          assert len(data['edges']) == 1013
          assert data['edges'] == sorted(data['edges'], key=lambda edge: edge.get('id', ''))

          items = reading['items']
          assert len(items) == 110
          assert sum(item.get('coverage_status') == 'developed_profile' for item in items) == 29
          assert sum(item.get('coverage_status') == 'represented' for item in items) == 1
          assert sum(item.get('coverage_status') == 'inventory_only' for item in items) == 80

          observations = data['ai_observations']
          assert observations['release'] == meta['release']
          assert observations['generated'] == meta['generated']
          assert len(observations['observations']) == 17

          profile_ids = {profile['node_id'] for profile in data['profiles']}
          assert 'person_david_ing' in profile_ids
          assert 'practice_core_systems_practice_spine' in profile_ids
          assert 'approach_family_service_systems_thinking' in profile_ids
          assert 'publication_pattern_manual_service_systems_thinking' in profile_ids

          journey_ids = {journey['id'] for journey in data['journeys']}
          assert 'journey_david_ing_systems_in_plural' in journey_ids
          assert 'journey_core_systems_practice_reading' in journey_ids

          reading_html = Path('docs/reading-list.html').read_text(encoding='utf-8')
          assert 'Reading-list depth map' in reading_html
          assert '110' in reading_html
          assert 'developed profile' in reading_html.casefold()

          index = Path('docs/index.html').read_text(encoding='utf-8')
          update_url = 'https://github.com/antlerboy/the-necessary-tangle/issues/2'
          assert index.count(update_url) == 1
          assert 'id="themeToggle"' in index
          assert 'David Ing' in index
          assert 'Reading-list depth map' in index
          assert 'Core systems practice' in index

          public_text = '\n'.join([
              Path('docs/index.html').read_text(encoding='utf-8'),
              Path('docs/reading-list.html').read_text(encoding='utf-8'),
              Path('documentation/core-systems-practice.md').read_text(encoding='utf-8'),
              Path('documentation/reading-list-coverage.md').read_text(encoding='utf-8'),
              Path('documentation/ai-observations.md').read_text(encoding='utf-8'),
          ]).casefold()
          for forbidden in ('chatgpt', 'openai', 'this conversation', 'our conversation', 'previously omitted', 'we forgot', 'i forgot', 'assistant said'):
              assert forbidden not in public_text, forbidden

          print(json.dumps({
              'release': meta['release'],
              'entries': meta['public_entry_count'],
              'profiles': meta['profile_count'],
              'sources': meta['source_count'],
              'public_link_sources': meta['public_link_source_count'],
              'edges': len(data['edges']),
              'journeys': meta['journey_count'],
              'reading_items': len(items),
              'reading_developed_profiles': sum(item.get('coverage_status') == 'developed_profile' for item in items),
              'reading_represented': sum(item.get('coverage_status') == 'represented' for item in items),
              'reading_inventory_only': sum(item.get('coverage_status') == 'inventory_only' for item in items),
              'ai_observations': len(observations['observations']),
              'update_routes': index.count(update_url),
          }, indent=2, sort_keys=True))
          PY

      - name: Commit only the validated release state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/apply-iteration-15.yml
          rm -rf scripts/__pycache__ validation
          git config user.name "Benjamin P Taylor"
          git config user.email "benjamin.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish iteration 0.15: David Ing, reading depth and core systems practice" -m "Develop David Ing's service-systems, learning and lineage-documentation constellation; add an item-level reading-list depth map; connect the professional systems-practice spine across concepts, approaches, modelling and intervention; and regenerate graph observations from the current release."
          git push origin HEAD:agent/iteration-15-ing-reading-practice
