name: Restore The Necessary Tangle release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download and unpack the reviewed public release
        shell: bash
        run: |
          set -euo pipefail
          token='IQCdQCtfQR4XSp4ymaD2Ibj7AZuKM9gOFFDQNMxg%5Fcckj0s'
          base='https://redquadrantltd.sharepoint.com/sites/RedQuadrantPublicFiles/_layouts/15'
          success=''
          for url in \
            "$base/download.aspx?share=$token" \
            "$base/guestaccess.aspx?share=$token&download=1"
          do
            rm -f /tmp/the-necessary-tangle.tar.gz
            if curl --fail --location --retry 3 --retry-delay 2 "$url" --output /tmp/the-necessary-tangle.tar.gz \
              && tar -tzf /tmp/the-necessary-tangle.tar.gz >/dev/null 2>&1
            then
              success='yes'
              break
            fi
          done
          test "$success" = 'yes'
          tar -xzf /tmp/the-necessary-tangle.tar.gz -C .

      - name: Commit the reviewed release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish The Necessary Tangle public alpha'
          git push
