name: Apply iteration 0.14 Snowden and Cynefin sources

on:
  push:
    branches: ["agent/iteration-14-snowden-canonical-sources"]
    paths:
      - ".github/workflows/apply-iteration-14.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-iteration-14-snowden-canonical-sources
  cancel-in-progress: false

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-14-snowden-canonical-sources
          fetch-depth: 0

      - name: Verify and apply source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .release/iteration-14-source/part-* | base64 --decode > /tmp/iteration-14-source.patch.xz
          test "$(wc -c < /tmp/iteration-14-source.patch.xz)" -eq 27672
          echo "01c56bc77c4f7e6680e37712d3f9d678da7ca45d46fbe4b0cdff2523feb8b0c9  /tmp/iteration-14-source.patch.xz" | sha256sum -c -
          xz -dc /tmp/iteration-14-source.patch.xz > /tmp/iteration-14-source.patch
          git apply --check /tmp/iteration-14-source.patch
          git apply /tmp/iteration-14-source.patch

          base64 --decode .release/iteration-14-validator-scrub.patch.xz.b64 > /tmp/iteration-14-validator-scrub.patch.xz
          test "$(wc -c < /tmp/iteration-14-validator-scrub.patch.xz)" -eq 1228
          echo "2635b2f4da911ac3ff0ac04bb933ec8b3a79b21f256c40527ec9da59ba13e66e  /tmp/iteration-14-validator-scrub.patch.xz" | sha256sum -c -
          xz -dc /tmp/iteration-14-validator-scrub.patch.xz > /tmp/iteration-14-validator-scrub.patch
          git apply --check /tmp/iteration-14-validator-scrub.patch
          git apply /tmp/iteration-14-validator-scrub.patch

      - name: Build, validate and prove repeatability
        shell: bash
        run: |
          set -euo pipefail
          make validate
          find . -type f \
            ! -path './.git/*' \
            ! -path './scripts/__pycache__/*' \
            ! -path './validation/*' \
            ! -path './.release/*' \
            ! -path './.github/workflows/apply-iteration-14.yml' \
            ! -path './.github/workflows/export-iteration-14-source.yml' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/build-a.sha256
          make build
          find . -type f \
            ! -path './.git/*' \
            ! -path './scripts/__pycache__/*' \
            ! -path './validation/*' \
            ! -path './.release/*' \
            ! -path './.github/workflows/apply-iteration-14.yml' \
            ! -path './.github/workflows/export-iteration-14-source.yml' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/build-b.sha256
          cmp /tmp/build-a.sha256 /tmp/build-b.sha256
          git diff --check

      - name: Verify the release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          published = json.loads(Path('docs/assets/public-data.json').read_text(encoding='utf-8'))
          meta = data['meta']

          assert meta['release'] == '0.14-snowden-cynefin-alpha'
          assert meta['generated'] == '2026-08-11'
          assert meta['public_entry_count'] == 483
          assert meta['profile_count'] == 99
          assert meta['source_count'] == 140
          assert meta['public_link_source_count'] == 127
          assert meta['journey_count'] == 16
          assert len(data['edges']) == 994
          assert published['meta'] == meta

          observations = data['ai_observations']
          assert observations['release'] == meta['release']
          assert observations['generated'] == meta['generated']
          assert len(observations['observations']) == 13

          profiles = {profile['node_id']: profile for profile in data['profiles']}
          dave = json.dumps(profiles['person_dave_snowden']).casefold()
          cynefin = json.dumps(profiles['method_or_methodology_cynefin_framework']).casefold()
          sensemaker = json.dumps(profiles['tool_sensemaker']).casefold()
          assert all(term in dave for term in ('cynefin', 'sensemaker', 'anthro-complexity'))
          assert all(term in cynefin for term in ('sense-making', 'domain', 'context'))
          assert all(term in sensemaker for term in ('distributed ethnography', 'micro-narrative'))

          index = Path('docs/index.html').read_text(encoding='utf-8')
          update_url = 'https://github.com/antlerboy/the-necessary-tangle/' + 'issues/' + '2'
          expected_anchor = '<a class="update-thread-dot" data-update-thread-dot href="' + update_url + '" target="_blank" rel="noopener" aria-label="Open updates"></a>'
          assert index.count(update_url) == 1
          assert expected_anchor in index
          assert Path('documentation/snowden-cynefin-sources.md').is_file()
          assert Path('documentation/ai-observations.md').read_text(encoding='utf-8').startswith('# AI observations\n\nGenerated for release `0.14-snowden-cynefin-alpha`')

          print(json.dumps({
              'release': meta['release'],
              'generated': meta['generated'],
              'entries': meta['public_entry_count'],
              'profiles': meta['profile_count'],
              'sources': meta['source_count'],
              'journeys': meta['journey_count'],
              'edges': len(data['edges']),
              'ai_observations': len(observations['observations']),
              'update_routes': index.count(update_url),
          }, indent=2, sort_keys=True))
          PY

      - name: Commit the successful build candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/apply-iteration-14.yml
          rm -f .github/workflows/export-iteration-14-source.yml
          rm -rf scripts/__pycache__ validation
          git config user.name "Benjamin P Taylor"
          git config user.email "benjamin.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish iteration 0.14 Snowden and Cynefin sources" -m "Add the Dave Snowden and Cynefin expertise constellation, distinguish first-party source roles from independent evidence, regenerate AI observations from the current graph, and retain one discreet bottom-right route to public updates."
          git push origin HEAD:agent/iteration-14-snowden-canonical-sources
