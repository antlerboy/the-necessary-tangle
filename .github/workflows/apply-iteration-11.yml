name: Apply iteration 0.11 visual map

on:
  push:
    branches: ["agent/iteration-11-visual-map"]
    paths:
      - ".github/workflows/apply-iteration-11.yml"
      - ".iteration11-bundle/**"
      - "scripts/apply_iteration_11.py"
      - "scripts/fix_iteration_11_regression_gates.py"
      - "scripts/fix_iteration_11_legacy_zoom.py"
      - "scripts/fix_iteration_11_zoom_marker.py"
      - "scripts/fix_iteration_11_build_idempotency.py"
      - "scripts/normalise_iteration_11_dot.py"

permissions:
  contents: write

concurrency:
  group: apply-iteration-11
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out iteration branch
        uses: actions/checkout@v7
        with:
          ref: agent/iteration-11-visual-map
          fetch-depth: 0

      - name: Reconstruct and inspect the iteration source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .iteration11-bundle/part-* | base64 --decode > /tmp/iteration11-source.tar.gz
          test "$(wc -c < /tmp/iteration11-source.tar.gz)" -eq 11638
          echo "af6a6b8216ad179a3183271495f57b4063a9250c1744c52907aaf501bb5d59f9  /tmp/iteration11-source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/iteration11-source.tar.gz
          tar -xzf /tmp/iteration11-source.tar.gz -C .

      - name: Show the curator-dot validation contract
        run: grep -n -B 6 -A 6 "accessible name" scripts/validate_iteration_11.py || true

      - name: Prepare the durable release build
        run: python3 scripts/prepare_iteration_11_release.py

      - name: Update retained regression and build gates
        run: |
          python3 scripts/fix_iteration_11_regression_gates.py
          python3 scripts/fix_iteration_11_zoom_marker.py
          python3 scripts/fix_iteration_11_build_idempotency.py

      - name: Remove the obsolete whole-SVG zoom implementation
        run: python3 scripts/fix_iteration_11_legacy_zoom.py

      - name: Build and validate twice
        run: |
          make validate
          make validate
          git diff --check

      - name: Verify the release contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          index = Path('docs/index.html').read_text(encoding='utf-8')
          app = Path('docs/assets/app.js').read_text(encoding='utf-8')
          assert data['meta']['release'] == '0.11-visual-map-alpha'
          assert data['meta']['public_entry_count'] == 417
          assert data['meta']['profile_count'] == 38
          assert data['meta']['journey_count'] == 13
          assert data['meta']['source_count'] >= 100
          assert data['map_experience']['model'] == 'whole-to-detail conceptual navigation'
          assert 'data-curator-dot="comments"' in index
          assert index.count('https://github.com/antlerboy/the-necessary-tangle/issues/2') == 1
          assert 'svg.style.transform' not in app
          for marker in ('mapMiniMap', 'mapZoomRange', 'mapFullscreen', 'mapFocusHistory', 'semanticZoomBand'):
              assert marker in index or marker in app
          print(json.dumps({
              'release': data['meta']['release'],
              'entries': data['meta']['public_entry_count'],
              'profiles': data['meta']['profile_count'],
              'journeys': data['meta']['journey_count'],
              'sources': data['meta']['source_count'],
              'map_model': data['map_experience']['model'],
              'graph_snapshot': data['graph_snapshot'],
          }, indent=2, sort_keys=True))
          PY

      - name: Remove staging and one-shot construction files
        run: |
          rm -rf .iteration11-bundle
          rm -f .github/workflows/apply-iteration-11.yml
          rm -f scripts/prepare_iteration_11_release.py
          rm -f scripts/fix_iteration_11_regression_gates.py
          rm -f scripts/fix_iteration_11_legacy_zoom.py
          rm -f scripts/fix_iteration_11_zoom_marker.py
          rm -f scripts/fix_iteration_11_build_idempotency.py
          git status --short

      - name: Commit the validated iteration
        run: |
          git config user.name "Benjamin P Taylor"
          git config user.email "ben.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish iteration 0.11 visual map" -m "Restore the curator's bottom-right comment dot and rework map navigation around whole-to-detail conceptual exploration: semantic zoom, minimap, focus history, zoom slider, fullscreen mode, selected-relation labels and keyboard controls."
          git push origin HEAD:agent/iteration-11-visual-map
