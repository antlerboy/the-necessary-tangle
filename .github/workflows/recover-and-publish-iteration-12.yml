name: Recover and publish the actual iteration 0.12 release

on:
  push:
    branches: ["agent/publish-iteration-12-real"]
    paths:
      - ".github/workflows/recover-and-publish-iteration-12.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-publish-iteration-12-real
  cancel-in-progress: false

jobs:
  recover-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean branch from current main
        uses: actions/checkout@v7
        with:
          ref: agent/publish-iteration-12-real
          fetch-depth: 0

      - name: Recover the verified iteration source set
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/pull/22/head:refs/remotes/origin/pr22
          python3 - <<'PY'
          import base64, hashlib, pathlib, re, subprocess, tarfile

          commit = '8ab7912a36a8e42fcd24c3145a0f6def0d27f285'

          def git_text(path):
              return subprocess.check_output(
                  ['git', 'show', f'{commit}:{path}'],
                  text=True,
                  encoding='utf-8',
              )

          def decode(paths):
              text = ''.join(git_text(path) for path in paths)
              text = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              text += '=' * ((4 - len(text) % 4) % 4)
              return base64.b64decode(text, validate=False)

          payloads = [
              (
                  '/tmp/iteration-12-source.tar.gz',
                  decode([
                      *[f'.iteration12-bundle/piece-{i:02d}' for i in range(6)],
                      *[f'.iteration12-bundle/part-{i:02d}' for i in range(1, 5)],
                  ]),
                  54715,
                  'b30071976cb536ad9c1c4a5023e2ca6828d179ace8fac185e2085095e5c7bc1a',
              ),
              (
                  '/tmp/iteration-12-validator-fixes.tar.gz',
                  decode([
                      '.iteration12-bundle/validator-piece-00',
                      '.iteration12-bundle/validator-piece-01',
                  ]),
                  11987,
                  'ad72b74625338abbcdfbc4621e9e476b0d6542339f7c70141e9adda161a91add',
              ),
          ]

          for filename, payload, expected_size, expected_sha in payloads:
              digest = hashlib.sha256(payload).hexdigest()
              print(filename, len(payload), digest)
              if len(payload) != expected_size or digest != expected_sha:
                  raise SystemExit(f'Archive contract failed: {filename}')
              path = pathlib.Path(filename)
              path.write_bytes(payload)
              with tarfile.open(path, 'r:gz') as archive:
                  members = archive.getmembers()
                  for member in members:
                      candidate = pathlib.PurePosixPath(member.name)
                      if candidate.is_absolute() or '..' in candidate.parts:
                          raise SystemExit(f'Unsafe archive path: {member.name}')
                  archive.extractall('.')
                  print('Extracted', len(members), 'members from', filename)

          required = [
              'scripts/apply_iteration_12.py',
              'scripts/patch_iteration_12.py',
              'scripts/validate_iteration_12.py',
              'documentation/explicit-semantics.md',
              'documentation/reading-list-coverage.md',
              'documentation/scio-coverage.md',
          ]
          missing = [path for path in required if not pathlib.Path(path).is_file()]
          if missing:
              raise SystemExit(f'Missing recovered files: {missing}')
          PY

      - name: Repair durable validator compatibility
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:scripts/validate_expansion_08.py > scripts/validate_expansion_08.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_expansion_08.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'ALLOWED_RELEASES = {"0.8-expansion-alpha", "0.9-observations-alpha", "0.10-practice-safety-alpha", "0.11-visual-map-alpha"}',
              'ALLOWED_RELEASES = {"0.8-expansion-alpha", "0.9-observations-alpha", "0.10-practice-safety-alpha", "0.11-visual-map-alpha", "0.12-practitioner-intake-alpha"}',
              1,
          )
          text = text.replace(
              'elif meta.get("release") == "0.11-visual-map-alpha":',
              'elif meta.get("release") in {"0.11-visual-map-alpha", "0.12-practitioner-intake-alpha"}:',
              1,
          )
          path.write_text(text, encoding='utf-8')

          makefile = Path('Makefile')
          lines = [
              line for line in makefile.read_text(encoding='utf-8').splitlines()
              if 'scripts/normalise_iteration_11_dot.py' not in line
          ]
          for index, line in enumerate(lines):
              if 'scripts/patch_iteration_12.py' in line:
                  lines.insert(index + 1, '\tpython3 scripts/normalise_iteration_11_dot.py')
                  break
          else:
              raise SystemExit('Missing patch_iteration_12.py in Makefile')
          makefile.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Build and validate twice
        run: |
          make validate
          make validate
          git diff --check

      - name: Verify the generated public release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/public-data.json').read_text(encoding='utf-8'))
          published = Path('docs/assets/public-data.json').read_text(encoding='utf-8')
          index = Path('docs/index.html').read_text(encoding='utf-8')
          app = Path('docs/assets/app.js').read_text(encoding='utf-8')
          labels = {node.get('label') for node in data.get('nodes', [])}
          node_ids = {node.get('id') for node in data.get('nodes', [])}
          meta = data['meta']

          assert meta['release'] == '0.12-practitioner-intake-alpha'
          assert meta['public_entry_count'] == 442
          assert meta['profile_count'] == 58
          assert meta['source_count'] == 114
          assert meta['journey_count'] == 14
          assert len(data['edges']) == 917

          assert {'Ivo Velitchkov', 'Patrick Hoverstadt'} <= labels
          assert 'Ivo Velitchkov' in published
          assert 'Patrick Hoverstadt' in published
          assert any(label and 'Grammar of Systems' in label for label in labels)
          assert any(label and 'Fractal' in label for label in labels)
          assert {
              'person_ivo_velitchkov',
              'person_patrick_hoverstadt',
              'publication_essential_balances',
              'concept_requisite_inefficiency',
              'concept_natural_drift',
              'concept_explicit_semantics',
              'tool_nodica',
          } <= node_ids

          accepted = data['accepted_contributions']
          assert len(accepted) == 1
          assert accepted[0]['issue_number'] == 21
          assert accepted[0]['status'] == 'incorporated_with_independent_sources'

          assert 'Start somewhere smaller' in index
          assert index.count('https://github.com/antlerboy/the-necessary-tangle/issues/2') == 1
          assert index.count('data-curator-dot="comments"') == 1
          assert 'site-submission,awaiting-curator-review' in app
          assert Path('documentation/explicit-semantics.md').is_file()
          assert Path('documentation/reading-list-coverage.md').is_file()
          assert Path('documentation/scio-coverage.md').is_file()

          print(json.dumps({
              'release': meta['release'],
              'entries': meta['public_entry_count'],
              'profiles': meta['profile_count'],
              'sources': meta['source_count'],
              'journeys': meta['journey_count'],
              'edges': len(data['edges']),
          }, indent=2, sort_keys=True))
          PY

      - name: Commit the validated durable release
        run: |
          rm -f .github/workflows/recover-and-publish-iteration-12.yml
          rm -rf .iteration12-bundle
          git config user.name "Benjamin P Taylor"
          git config user.email "benjamin.taylor@redquadrant.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish the actual iteration 0.12 release" -m "Recover the validated practitioner-intake source set, add developed Ivo Velitchkov and Patrick Hoverstadt coverage, incorporate contribution 21, publish explicit semantics and honest reading-list and SCiO coverage reports, and retain the calmer route into the atlas."
          git push origin HEAD:agent/publish-iteration-12-real
