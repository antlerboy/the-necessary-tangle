name: Challenge a connection or claim
description: Question the wording, direction, scope, status or evidence of a published statement.
title: "[Challenge] "
body:
  - type: input
    id: statement
    attributes:
      label: Connection or claim
      description: Copy the exact wording and provide its public link.
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is the main problem?
      options:
        - Wrong connection type
        - Wrong direction
        - Scope is too broad
        - Evidence does not support the wording
        - Important counter-evidence is missing
        - Status or confidence is wrong
        - Other
    validations:
      required: true
  - type: textarea
    id: case
    attributes:
      label: Your case
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source URL or full citation
    validations:
      required: false
  - type: textarea
    id: alternative
    attributes:
      label: Better wording or alternative account
    validations:
      required: false
